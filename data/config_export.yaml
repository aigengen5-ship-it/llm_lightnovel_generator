theme_jinshugai:
- concept: 주인공은 작은 계기로 인해 점점 상대방에 대한 애정이 깊어지고, 상대방의 결정적 도움 끝에 주인공을 상대방 전용의 사랑스러운 연인으로 변모시키는 러브코메디.
  import_point: 러브코메디이므로, 상대방의 모든 행동과 생각은 주인공에 대한 애정에서 기반하며, 주인공은 평범한 일상을 유지하면서도 상대방 앞에서 사랑스러운 연인이 된다.
  id: 1
  first_event:
  - 주인공이 치한에게 추행당할 때 상대방이 도와줌.
  - 주인공이 밤 늦게 비를 맞으며 울고 있을 때 상대방이 도와줌
  - 주인공이 강간당할 위기에서 상대방이 도와줌
  - 주인공의 직업에 걸맞지 않은 숨겨진 취미(서브컬쳐)를 상대방에게 들키지만, 상대방은 비밀을 지키고 서브컬쳐로 이야기꽃을 나눈다.
  - 주인공이 남들에게 숨기고 싶었던 과거의 뼈아픈 트라우마(혹은 가장 약하고 비참한 모습)가 강제로 폭로될 위기에서 상대방이 스스로 악역을 자처해 시선을 돌려줌.
  - 주인공이 심각한 오해를 받아 모두가 손가락질하며 등을 돌렸을 때, 유일하게 상대방만이 아무런 조건 없이 주인공의 결백을 믿어줌.
  - 주인공의 부끄러운 비밀이 상대방에게 우연히 들통나지만, 상대방이 모른척해줌.
  - 주인공을 끈질기게 괴롭히며 가스라이팅하던 쓰레기 전남친(또는 스토커)이 회사/학교 앞까지 찾아왔을 때, 평소 데면데면했던 상대방이 기지(?)를 발휘해 '나 얘랑 동거 중인 약혼자인데?'라며 완벽한 연기로 구출해
    줌. (이후 가짜 연기가 진짜 밀착으로 이어짐).
  - 사회적으로 유명한 잉꼬부부지만, 실제로는 서로 바람을 피우면서 싸우기만 하는 부모님에 질려서 집을 나와 캐리어를 끌고 비 오는 공원 벤치에 주저앉아 멍하니 있던 주인공. 그때 우산을 씌워주면서 몸을 녹이라고 말해주는
    상대방
  - 상대방을 멸시하던 주인공이 실수로 크게 다칠뻔하지만 상대방이 도와주고 별 일 아니라는 듯이 넘어간다.
  second_event:
  - 주인공이 사랑을 느끼고 미소 짓는 모습을 몰래 찍은 협박범이 사회적 매장을 빌미로 협박할 때, 상대방이 협박범을 무자비하게 짓밟아 영상을 회수해 주고, 구원받은 주인공이 이성을 버린 척 스스로 목줄을 차며 애완동물이
    되기를 자처함.
  - 흉악한 스토커나 괴한에게 납치되어 강간당할 절대절명의 위기에서 상대방이 주인공을 구해내고, 바깥세상의 끔찍한 공포에 질린 주인공이 '오직 당신의 방 안에서만, 당신의 사랑만 받으며 살겠다'며 영구적인 감금을 애원함.
  - 주인공의 탐욕스럽고 폭력적인 가족들이 강제 정략결혼(또는 감금)을 시키려 억지로 끌고 갈 때, 상대방이 권력과 재력으로 가족들과의 연을 완벽히 끊어내 주고, 갈 곳 없어진 주인공이 감격의 눈물을 흘리며 영원히 상대방의
    연인이 되겠다고 맹세함.
  - 끔찍한 범죄나 스캔들에 억울하게 휘말려 모두가 주인공에게 돌을 던지고 감옥에 갈 위기에 처했을 때, 오직 상대방만이 모든 죄를 덮어주고(혹은 완벽히 해결해주고) 품어주자, 세상의 냉혹함에 환멸을 느낀 주인공이 이성적인
    사고를 포기하는 척하고 오직 사랑만 쫓는 남주의 사랑 인형으로 행동한다.
