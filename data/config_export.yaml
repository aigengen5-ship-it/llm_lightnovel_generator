- name: 순애타락
  desc: 지성, 이성, 도덕심은 그대로이지만 오카베 켄의 명령이나 사랑이 가장 중요함. 수동적이고 순종적으로 사랑에 빠짐
corruption_elements: *id002
body_change: *id003
body_change_sign: 상대방 집에 방문하고 싶어하고 집안일을 하고 싶어한다.
corruption_guides:
- 변장을 하고 스케줄을 마친 퇴근길 인파 속에서 치한에게 추행당하며 공포에 질린 순간 켄이 나타나 자신을 구해주는 이벤트.
- 정체를 들킬까 봐 전전긍긍하던 중 켄의 품 안에서 안도감을 느끼지만 이내 민망함에 퉁명스럽게 굴며 켄을 밀쳐내는 반응.
- 밤늦게 켄과 전화를 하며 게임을 하다가 무의식적으로 사랑스러운 한숨을 내뱉으며 묘한 분위기를 형성하는 이벤트.
- 자신의 한숨에 당황한 켄의 반응을 보며 짐짓 아무렇지 않은 척하지만 뺨이 붉어진 채로 삐친 티를 내는 모습.
- 켄의 헌신적인 다정함에 완전히 마음이 열려 아이돌로서의 긴장을 풀고 먼저 다가가 옷소매를 붙잡고 응석을 부리는 이벤트.
- 더 이상 거리를 두지 않고 켄의 옆에 딱 붙어서 사랑스러운 눈빛으로 켄의 관심을 갈구하는 애교 섞인 행동.
- 몇 달의 시간이 흐른 뒤 붐비는 거리에서 변장한 채 켄과 밀착하며 손이 겹치는 신체 접촉이 발생해 심장이 미친 듯이 뛰는 이벤트.
- 갑작스러운 고동에 당황하며 평범한 일상을 지키려 하지만 켄의 향기에 본능적으로 안심하며 얼굴을 붉히는 모습.
- 켄과 함께 비밀리에 맛집을 탐방하며 그의 취향에 맞춰 음식을 먹어보며 정서적 유대감과 깊은 친밀감을 느끼는 이벤트.
- 켄의 다정한 챙김에 마음이 약해져 무의식적으로 그의 어깨에 머리를 기대며 그만의 체취에 깊이 빠져드는 변화.
- 켄의 집을 방문해 켄을 기쁘게 하고 싶다는 강렬한 욕구에 휩싸여 무의식적으로 앞치마를 두르고 집안일을 시작하는 이벤트.
- 켄의 칭찬을 받을 때 뇌내 도파민이 폭발하는 듯한 극상의 쾌락을 느끼며 스스로를 봉사하는 존재로 각인시키기 시작하는 모습.
- 켄의 제안으로 오픈 폴리스 셔츠와 비닐 마이크로 스커트 등 파격적인 복장을 입고 수갑을 찬 채 켄의 애정을 갈구하는 이벤트.
- 아이돌로서의 자존심으로 저항해보려 하지만 켄의 집요한 사랑 공세와 칭찬 보상 체계에 결국 5번째 시도 끝에 완전히 굴복하는 모습.
- 완전히 권속화되어 켄의 모든 것을 사랑하게 된 후와리가 그에게 매달려 진한 키스를 퍼부으며 체취에 집착하는 이벤트.
- 켄 없이는 아무것도 할 수 없다며 그의 품 안에서 영혼까지 맡긴 채 세상에서 가장 사랑스러운 어리광쟁이로 변한 모습.
- 갑작스러운 악의적인 스캔들로 인해 사회적으로 매장당하고 모든 커리어를 잃어 깊은 절망과 공포에 빠지는 위기 이벤트.
- 세상 모두가 손가락질할 때 오직 켄만이 자신을 구원하고 품어주자 그에게 맹목적인 신뢰를 느끼며 이성을 포기하고 매달리는 모습.
- 켄의 보호 아래 시스루 블라우스 차림으로 그의 무릎 위에 올라타 가랑이를 비비며 오직 켄만을 위한 사랑 인형이 된 일상 이벤트.
- 몇 년 뒤 아내가 된 후와리가 집 안에서는 아이들 앞에서도 부끄러움 없이 켄에게 매달려 애정행각을 벌이는 쌍방 의존증의 완성된 모습.
partner_corruption_guides:
- 추행범을 발견하자마자 천박한 말투로 욕설을 내뱉으며 압도적인 기세로 정체를 숨긴 후와리를 보호하는 반응.
- 구해주고 나서도 툴툴대는 후와리를 보며 한심하다는 듯 웃으면서도 머리를 쓰다듬어주려는 다정한 반응.
- 수화기 너머로 들려온 후와리의 사랑스러운 한숨에 심장이 뛰면서도 입으로는 저질스러운 농담으로 당혹감을 숨기는 반응.
- 삐쳐서 토라진 후와리의 투정을 다 받아주며 그녀가 잠들 때까지 다정하게 전화를 끊지 않고 기다려주는 반응.
- 갑자기 달라진 후와리의 애교 섞인 태도에 당황하면서도 입가에 미소를 띠며 그녀를 꽉 껴안아주는 반응.
- 매달리는 후와리를 보며 천박하게 놀리면서도 실제로는 그녀의 모든 요구를 들어주는 헌신적인 사랑의 반응.
- 손이 닿은 후와리의 떨림을 느끼고는 천박한 농담을 던지며 놀리지만 실제로는 그녀를 놓치고 싶지 않아 손가락을 얽어 꽉 잡는 반응.
- 가슴팍을 때리는 후와리의 작은 손길을 귀여워하며 그녀의 붉어진 얼굴을 빤히 바라보며 더욱 가깝게 밀착하는 반응.
- 자신의 식성을 좋아해 주는 후와리를 보며 뿌듯해하고 그녀의 입가에 묻은 음식을 다정하게 닦아주며 묘한 기류를 만드는 반응.
- 어깨에 기대오는 후와리의 무게감을 느끼며 그녀의 정수리에 살짝 입을 맞추고 더욱 포근하게 감싸 안아주는 반응.
- 집안일을 자처하는 후와리를 보며 기특해하며 그녀의 허리를 뒤에서 껴안고 귓가에 달콤하고 천박한 칭찬을 속삭이는 반응.
- 칭찬에 민감하게 반응하는 후와리의 상태를 눈치채고 그녀가 자신에게 더 의존하도록 정교하게 칭찬 보상을 주는 반응.
- 경찰 코스프레 복장을 한 후와리의 모습에 흥분하면서도 그녀가 부끄러워하는 모습이 사랑스러워 집요하게 스킨십을 시도하는 반응.
- 저항하던 후와리가 마침내 굴복해 안겨오자 승리감 섞인 미소를 지으며 그녀의 모든 곳을 사랑스럽게 탐닉하는 반응.
- 키스 세례를 퍼붓는 후와리를 기쁘게 받아내며 그녀의 집착 어린 사랑을 당연하다는 듯이 받아들이고 더 큰 애정으로 답하는 반응.
- 완전히 자신의 것이 된 후와리를 품에 가두고 세상에서 가장 소중한 보물을 다루듯 헌신적으로 사랑하며 행복해하는 반응.
- 후와리의 스캔들을 해결하기 위해 자신의 모든 능력과 재력을 동원해 그녀를 외부 세계로부터 완벽하게 격리하고 구출하는 반응.
- 절망한 후와리를 품에 안고 이제는 오직 나만이 너의 세계라고 속삭이며 그녀를 심리적으로 완전히 자신의 소유로 만드는 반응.
- 쏟아지는 사랑 메시지와 집착을 기쁘게 받아내며 서로의 숨결이 섞이는 딥키스와 애무를 통해 완벽한 사랑의 일체감을 느끼는 반응.
- 몇 년 후 아버지가 된 켄이 아이들의 시선에도 아랑곳하지 않고 아내인 후와리를 품에 안고 뽀뽀를 퍼부으며 끈적한 일상을 즐기는 반응.
