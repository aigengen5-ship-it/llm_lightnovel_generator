theme_corruption_elements: &id001
- name: 순애타락
  desc: 지성, 이성, 도덕심은 그대로이지만 토리우미 코스케의 명령이나 사랑이 가장 중요함. 수동적이고 순종적으로 사랑에 빠짐
corruption_elements: *id001
body_change: *id002
body_change_sign: 엉덩이가 옷에 닿는 느낌이 달라짐
corruption_guides:
- 아이돌로서 치명적인 누명을 쓰고 대중과 동료들에게 배신당해 정점에서 바닥으로 추락하며, 빗속에서 홀로 울며 모든 것을 포기하려는 절망적인 상황을 연출한다.
- 모두가 등을 돌린 순간 코스케가 나타나 아무런 조건 없이 자신의 결백을 믿어주자, 그가 주는 절대적인 신뢰에 가슴 속 깊은 곳에서 알 수 없는 안도감과 묘한 고양감을 느끼며 그에게 의지하기 시작한다.
- 코스케의 다정함에 흔들리는 마음을 감추기 위해 대중 앞에서는 더욱 완벽하고 우아한 아이돌의 모습으로 무장하며, 코스케에게는 기품 있게 선을 긋는 철벽 방어를 시전한다.
- 실수로 코스케가 마시던 음료를 마신 후, 간접키스라는 자각과 함께 심장이 비정상적으로 빠르게 뛰는 신체적 변화에 당황하며, 정숙한 아이돌 이미지와 상충하는 낯선 설렘에 얼굴을 붉힌다.
- 자신의 심장 박동이 이성적인 호감이라는 것을 깨닫고 혼란스러워하며, 아이돌로서의 공적 자아를 유지하려 애쓰기에 일부러 더 퉁명스럽게 말을 내뱉으며 거리를 둔다.
- 코스케가 건네는 정중한 위로와 배려에 조금씩 마음의 빗장이 풀리며, 그를 바라보는 시선에 아이돌의 가식이 아닌 한 여자로서의 부드러운 애정이 섞이기 시작한다.
- 코스케를 향한 사랑을 완전히 자각하고, 남들 앞에서는 쿨한 톱 아이돌의 모습을 유지하지만 코스케와 단둘이 있을 때만 보여주는 갭 모에를 통해 그에 대한 깊은 애정을 드러낸다.
- 함께 식사를 하는 도중, 테이블 아래에서 몰래 코스케의 손을 꽉 잡고 꼼지락거리며 대중의 눈을 피해 즐기는 비밀스러운 스릴과 행복에 온몸이 짜릿해지는 것을 느낀다.
- 몇 달의 시간이 흘러 사랑이 깊어진 어느 날, 평범하게 대화를 나누던 중 그를 바라보는 것만으로 하복부가 뜨거워지며 젖어오는 낯선 쾌감에 휩싸이며 순진한 당혹감을 느낀다.
- 코스케를 향한 맹목적인 사랑과 심리적 안정이 억눌려 있던 여성 호르몬을 폭발시켜, 그에게 더 매력적으로 보이고 싶다는 몸의 본능이 신체적 성숙으로 발현되기 시작함을 직감한다.
- 시스루 블라우스와 가짜 안경을 착용해 아이돌의 신분을 숨기고 코스케와 데이트하던 중, 우연히 눈이 마주치자 심장이 터질 듯이 뛰며 그에게 완전히 매료된다.
- 거울을 통해 가슴이 눈에 띄게 커지고 엉덩이 라인이 육감적으로 변한 것을 인지하며, 이성적으로는 당황하지만 코스케가 이 변화를 좋아해 주길 바라는 모순적인 욕망에 휩싸인다.
- 정숙하게 첫사랑을 지키고 싶다는 소망과 아이돌로서의 책임감, 그리고 코스케에게 안기고 싶다는 본능 사이에서 격렬하게 갈등하며 그를 밀어내고 일상으로 돌아가려 강하게 저항한다.
- 블랙 레이스 브라와 허벅지 스트랩을 착용한 자신의 모습이 너무나 선정적으로 변했음을 깨닫고, 정숙함과 사랑스러움이 공존하는 내적 갈등 속에서 괴로워하며 눈물을 흘린다.
- 코스케 없는 일상이 너무나 고통스럽고 허전함을 깨달은 후, 아이돌의 자존심과 정숙함을 모두 내던지고 그를 찾아가 제발 곁에 있게 해달라며 울며 매달린다.
- 코스케의 품 안에서 그의 체취와 온기에 완전히 굴복하며, 이제는 지성과 이성보다 코스케의 사랑이 가장 중요한 메가데레 상태가 되어 그에게 영혼까지 맡긴다.
- 새벽의 고요한 분위기 속에서 코스케와 깊은 키스를 나누며, 그의 타액에서 느껴지는 달콤한 맛에 황홀경을 느끼고 정숙함을 완전히 버린 채 그에게 매달린다.
- 부티 쇼츠 차림으로 코스케의 무릎 위에 올라타 하루 종일 그를 꽉 끌어안고 떨어지지 않으려 하며, 오직 그만이 자신의 모든 것을 채워줄 수 있다는 절대적인 의존심을 보인다.
- 가족들이 쥬리나를 강제로 정략결혼 시키려 하며 끌고 가려는 위기 상황에서, 코스케가 압도적인 재력과 권력으로 상황을 해결하고 그녀를 구해내자 그에게 완전히 굴복하며 평생의 충성을 맹세한다.
- 구원에 대한 보상 심리로 경찰 복장과 네온 브라 등 파격적인 옷을 입고 코스케에게 딥키스와 애무를 갈구하며, 수저 없이 입술로 음식을 나누는 루틴에 행복해한다. 이후 몇 년 뒤, 아이들 앞에서도 부끄러움 없이 애정
  행각을 벌이는 맹목적인 사랑의 아내가 되어 마무리한다.
partner_corruption_guides:
- 세상 모든 사람이 쥬리나를 비난해도 그녀의 순수한 본성을 믿으며, 정중하고 차분한 말투로 그녀의 곁을 지키며 절대 떠나지 않겠다는 구원자적인 면모를 보인다.
- 쥬리나가 당황하며 거리를 두려 해도 상처받지 않고, 그저 그녀가 마음의 안정을 찾을 때까지 묵묵히 우산을 씌워주며 다정한 미소로 그녀를 감싸 안는다.
- 쥬리나가 아이돌로서의 기품을 유지하며 철벽을 쳐도 그것이 그녀의 서툰 방어 기제임을 이해하며, 변함없이 친절하고 정중하게 그녀를 대하며 신뢰를 쌓는다.
- 쥬리나가 자신의 음료를 마시고 얼굴이 새빨개져 당황하는 모습을 보며, 톱 아이돌의 모습 뒤에 숨겨진 순진하고 귀여운 본모습에 깊은 애정을 느낀다.
- 쥬리나의 퉁명스러운 말투 속에서도 그녀의 눈빛이 흔들리고 있음을 눈치채고, 부담스럽지 않은 적당한 거리에서 세심하게 그녀의 필요를 채워준다.
- 쥬리나가 느끼는 심리적 압박감을 덜어주기 위해 소꿉친구 시절의 천진난만한 추억을 언급하며, 그녀가 가장 편안하게 웃을 수 있는 환경을 만들어준다.
- 남들 앞에서는 도도한 쥬리나가 테이블 아래에서 자신의 손을 꽉 잡는 도발적인 행동을 보이자, 당황하면서도 그녀의 귀여운 이중성에 가슴이 벅차오름을 느낀다.
- 쥬리나의 손가락을 부드럽게 얽어 맞잡으며 그녀에게만 들리는 작은 목소리로 사랑을 속삭여, 그녀가 느끼는 비밀스러운 스릴을 함께 공유하며 애정을 키운다.
- 쥬리나가 갑자기 몸을 꼬며 당황해하자 걱정스러운 마음에 조심스럽게 손을 잡아주며 어디 아픈 곳은 없는지 다정하게 묻고 그녀의 상태를 세심하게 살핀다.
- 얼굴이 새빨개진 쥬리나의 순진한 반응을 보며, 그녀가 느끼는 신체적 변화가 자신을 향한 사랑의 증거라는 것을 어렴풋이 느끼고 더욱 소중하게 아껴준다.
- 쥬리나의 외모가 이전보다 훨씬 글래머러스하고 육감적으로 변한 것을 발견하고 깜짝 놀라지만, 그녀가 수치심을 느끼지 않도록 정중하게 칭찬하며 그녀의 변화를 긍정한다.
- 우연한 눈맞춤에 쥬리나가 강하게 반응하자, 그녀의 마음이 이미 자신에게 완전히 기울었음을 확신하고 그녀를 따뜻하게 포옹하며 안도감을 준다.
- 정숙함을 지키기 위해 갑자기 거리를 두며 저항하는 쥬리나의 모습에 가슴 아파하면서도, 그녀가 스스로의 욕망을 받아들일 때까지 묵묵히 기다려주는 인내심을 보인다.
- 쥬리나가 겪는 내적 갈등과 고뇌를 이해하며, 그녀가 어떤 모습으로 변하든, 혹은 어떤 선택을 하든 변함없이 사랑하겠다는 절대적인 믿음을 보여준다.
- 자신에게 제발 돌아와 달라며 울며 매달리는 쥬리나를 넓은 가슴으로 포근하게 안아주며, 이제는 아무 걱정 말고 자신의 사랑에 모든 것을 맡기라고 다정하게 속삭인다.
- 자신에게 완전히 의존하며 메가데레가 된 쥬리나의 모습에 깊은 행복을 느끼고, 그녀가 원하는 만큼의 끝없는 애정과 스킨십을 아낌없이 쏟아부어 그녀를 충족시킨다.
- 쥬리나의 진한 키스에 응하며 그녀의 풍만해진 신체 곡선을 조심스럽게 어루만지고, 그녀가 느끼는 쾌락과 행복이 극대화될 수 있도록 리드한다.
- 자신을 옥죄듯 껴안고 떨어지지 않으려는 쥬리나의 사랑스러운 집착을 기쁘게 받아들이며, 그녀가 세상에서 가장 사랑받는 여자임을 계속해서 확인시켜 준다.
- 쥬리나를 강제로 정략결혼 시키려는 가족들 앞에 나타나 압도적인 재력과 사회적 지위를 이용해 그들을 완벽하게 제압하고, 쥬리나를 그들의 구속으로부터 영원히 해방시킨다.
- 구원받은 쥬리나가 보여주는 파격적인 복장과 맹목적인 순종을 사랑스럽게 받아들이며, 그녀와 딥키스와 애무를 나누고 이후 몇 년 뒤 아이들 앞에서도 부끄러움 없이 서로를 갈구하는 꿀 떨어지는 남편이 되어 마무리한다.
