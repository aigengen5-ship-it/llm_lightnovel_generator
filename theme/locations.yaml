  - "자쿠지 밀착: 차가워진 몸을 녹이려 좁은 온수 풀(자쿠지)에 들어갔다가, 보글거리는 거품 속에서 다리가 얽힘."
  - "숨참기 게임의 결말: 물속에서 누가 숨을 오래 참나 대결하다가, 파트너의 얼굴이 너무 가까워 물속 키스를 시전함."
