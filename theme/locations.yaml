  - "땀방울의 설렘: 열광적으로 뛰고 난 뒤 땀에 젖어 헐떡이는 파트너의 목덜미와 가슴팍을 보고 강한 설렘을 느낌."
  - "무등 태우기: 무대가 안 보인다고 징징대자 어깨 위에 무등을 태워주는데, 허벅지와 목의 마찰에 서로 얼굴이 붉어짐."
