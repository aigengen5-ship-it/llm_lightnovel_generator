  - "물방울의 유혹: 파트너의 속눈썹과 쇄골에 맺힌 물방울이 묘하게 색기를 뿜어내어 무의식적으로 입술을 가져감."
  - "체온 나누기: 덜덜 떠는 상대를 커다란 비치타월 하나로 둥글게 싸매고, 그 안에 같이 들어가 꼭 끌어안음."
  - "야간 풀사이드: 아무도 없는 고요한 풀사이드 선베드에 나란히 누워, 젖은 몸을 맞대고 서로의 체온으로 몸을 말림."
