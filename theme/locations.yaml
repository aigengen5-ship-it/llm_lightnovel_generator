# 진슈가이(시온자와) 장소별 범용 로맨틱/엣찌/밀착 이벤트
# - 각 장소당 10개의 '두 사람이 함께 방문했을 때 발생하는' 이벤트
# - 직업/나이에 구애받지 않는 범용 이벤트
# - '청년'향 라이트 노벨 기준으로 검열됨
locations:
- category: 공공 / 행정 시설
  desc: 겉보기엔 길 잃은 취객이나 미아를 돕는 친절한 파출소입니다. 관광객들을 위해 항상 따뜻한 차와 푹신한 소파를 제공하며, 시온자와 최고의 치안(?)을 자랑합니다. 특히 분실물 센터에는 어째서인지 화려하고 예쁜 코스프레 의상들이 가득 쌓여 있어, 호기심 많은 시민들에게는 은근히 인기 있는 비밀의 명소로 통합니다.
  name: 시온자와 경찰서 진슈가이 특별파출소
  num: 1
  events:
  - "분실물 코스프레 착용: 옷이 젖거나 찢어져, 어쩔 수 없이 분실물 센터에 있던 노출도 높은 간호사/메이드 복장을 빌려 입게 됨."
  - "취조실 롤플레잉: 텅 빈 취조실에서 장난치다가, 분위기에 휩쓸려 서로의 비밀(혹은 짝사랑)을 자백하게 됨."
  - "수갑 해프닝: 장난감 수갑인 줄 알고 찼다가 열쇠가 없어 몇 시간 동안 손목이 묶인 채 밀착해서 행동함."
  - "수면 향차: 파출소에서 내어준 따뜻한 차가 긴장을 너무 풀어버리는 바람에, 상대의 어깨에 기대어 무방비하게 잠듦."
  - "비좁은 캐비닛 대피: 갑자기 들이닥친 불량배나 취객을 피해 좁은 서류 캐비닛 사이에 숨으며 숨결이 닿을 듯 밀착함."
  - "가출 연인 오해: 경찰관이 두 사람을 '사랑의 도피를 한 커플'로 오해하고 짓궂은 질문을 던져 얼굴이 붉어짐."
  - "머그샷 커플 사진: 장난삼아 신원 확인용 보드(머그샷)를 들고 커플 사진을 찍으며 미묘한 소유욕을 느낌."
  - "소지품 검사: 주머니를 털다가 부끄러운 물건(러브레터, 쪽지 등)이 떨어져 분위기가 달아오름."
  - "안전지대 효과: 바깥의 소란스러움과 대비되는 조용하고 안전한 분위기 탓에, 심리적 방어벽이 허물어져 애교를 부리게 됨."
  - "철창 룸서비스: 유치장 안에 갇힌 고양이(또는 소동물)를 꺼내려다 같이 갇혀버려, 좁은 공간에서 구조를 기다림."
- category: 공공 / 행정 시설
  desc: 시온자와 특유의 기후병인 '붉은 열병'을 치료하기 위해 시청에서 운영하는 최고급 웰니스 센터입니다. 눈부시게 아름다운 의료진들이 최상의 서비스를 제공하며, 이곳의 명물인 '아로마 테라피'를 받으면 하루의 스트레스와 피로가 마법처럼 사르르 녹아내려 다시는 이곳을 떠나고 싶지 않게 된다고 합니다.
  name: 시청 통합 케어 센터 (진슈가이 분소)
  num: 2
  events:
  - "아로마 오일 마사지: 직원이 자리를 비운 사이, 파트너가 대신 오일을 발라주며 야릇한 스킨십이 발생함."
  - "슬라임화: 웰니스 테라피가 너무 완벽해서 온몸의 뼈가 녹은 것처럼 힘이 빠져, 상대방에게 안겨서 이동하게 됨."
  - "붉은 열병 체크: 체온을 재야 한다며 간호사가 이마와 이마, 혹은 목덜미를 직접 맞대도록 유도함."
  - "가운 끈 풀림: 너무 매끄러운 재질의 스파 가운 끈이 스르륵 풀리며 아슬아슬한 노출 상황이 벌어짐."
  - "방음 불량: 옆방에서 들려오는 다른 사람의 야릇한 신음소리 때문에 두 사람 사이에 숨 막히는 침묵과 긴장감이 흐름."
  - "최면 테라피: 심신 안정 테라피 중 무의식 상태에 빠져, 평소 숨겨왔던 상대에 대한 독점욕을 솔직하게 털어놓음."
  - "비좁은 산소 캡슐: 1인용 회복 캡슐에 기계 고장으로 두 명이 들어가게 되어, 심장 박동 소리까지 공유함."
  - "페로몬 로션: 발라준 보습 로션이 체온과 섞이면서 강렬한 페로몬 효과를 내뿜어 이성을 흔듦."
  - "맥박 동기화: 센터의 특수 장치에 연결되어, 상대방을 쳐다볼 때 맥박이 얼마나 미친 듯이 뛰는지 스크린에 중계됨."
  - "착각의 침대: 회복실 침대가 너무 푹신해서, 자신도 모르게 상대를 침대 위로 끌어당겨 껴안음."
- category: 교육 / 훈련 시설
  desc: 명문대 및 공무원 합격률 100%를 자랑하는 엘리트 기숙 학원입니다. 낮에는 철저한 규율로 돌아가지만, 이곳의 진짜 비결은 밤에 이루어지는 '1:1 밀착 멘토링'입니다. 학업 스트레스에 지친 수험생들을 위해, 다정한 강사진이 매우 사적이고 친밀한 방식으로 학생들의 멘탈을 완벽하게 케어해 줍니다.
  name: 성인용 입시/공시 학원 '에덴 아카데미'
  num: 3
  events:
  - "책상 밑 스킨십: 엄격한 강사가 지나가는 동안, 책상 밑으로 몰래 손을 잡거나 허벅지를 쓰다듬으며 스릴을 즐김."
  - "밀착 멘토링의 변질: 1:1 과외 중 문제 풀이에 집중하는 대신, 서로의 얼굴과 입술에만 시선이 고정됨."
  - "틀릴 때마다 벌칙: 문제를 하나 틀릴 때마다 가벼운 키스나 부끄러운 질문에 대답해야 하는 은밀한 룰을 만듦."
  - "교과서 셰어링: 교재를 하나만 가져와 몸을 바짝 붙이고 어깨를 맞댄 채로 숨죽여 공부함."
  - "야간 자율학습 갇힘: 밤늦게까지 남았다가 학원 문이 잠겨, 텅 빈 교실에서 하룻밤을 보내게 됨."
  - "귀엣말 설명: 정숙해야 하는 자습실에서 문제 풀이를 알려주느라 귓가에 뜨거운 숨을 불어넣음."
  - "졸음 방지 사탕: 잠을 깨워주겠다며 입술과 입술로 박하사탕을 전해주는 아슬아슬한 상황."
  - "교탁 밑 은신: 순찰 도는 경비원을 피해 좁은 교탁 밑에 포개어 숨어, 심장 뛰는 소리를 들음."
  - "은밀한 낙서: 상대방의 노트 한구석에 '오늘 밤, 둘이서만 있는 시간 어때?' 같은 도발적인 메모를 남김."
  - "선생님 롤플레잉: 아무도 없는 교실에서 안경을 쓰고 '엄격한 선생님과 불량 학생' 상황극을 하며 놀다 진심이 됨."
- category: 교육 / 훈련 시설
  desc: 상류층 영애들이나 아나운서 지망생들이 완벽한 매너를 배우는 최고급 교양 아카데미입니다. 바른 자세, 우아한 미소, 그리고 '상대방을 매혹하는 궁극의 화술'을 배울 수 있습니다. 이곳의 코스를 수료한 졸업생들은 누구에게나 사랑받는 눈부심 매력의 소유자로 거듭난다고 알려져 있습니다.
  name: 진슈가이 예절 교양원 '퍼스트 레이디'
  num: 4
  events:
  - "자세 교정 스킨십: 허리와 가슴을 펴기 위해 강사가 시키는 대로 서로의 몸을 직접 터치하며 아찔함을 느낌."
  - "시선 맞추기 훈련: 3분 동안 눈을 피하지 않고 바라보는 훈련 중, 얼굴이 터질 듯 붉어지며 눈물이 맺힘."
  - "매혹의 화술 실습: '상대방을 유혹하는 멘트'를 실습하다가, 연기가 아니라 진짜로 고백해버리는 사태가 발생함."
  - "코르셋의 호흡 곤란: 드레스나 정장을 너무 조여 입어 숨을 못 쉬자, 급하게 아무도 없는 방에서 옷을 벗겨줌."
  - "사교댄스의 밀착: 왈츠 스텝을 밟다가 발이 꼬여 상대방의 품으로 완전히 쓰러짐."
  - "포도주 에티켓: 와인을 마시는 법을 배우다 살짝 취기가 올라, 평소의 우아함을 버리고 어리광을 부림."
  - "립스틱 테이스팅: '입술이 가장 돋보이는 표정'을 연습하다가 상대방이 충동적으로 입술을 훔치게 만듦."
  - "부부 오해: 원장이 두 사람의 완벽한 케미를 보고 '신혼부부 예절 교육을 하러 오셨군요'라고 착각함."
  - "테이블 밑의 발장난: 다도를 배우는 엄숙한 분위기 속에서, 테이블 아래로 서로의 맨발을 문지르는 배덕감을 느낌."
  - "칭찬 폭격 훈련: 서로의 장점을 10가지씩 말하는 훈련을 하다가 부끄러움에 완전히 녹아내림."
- category: 상업 / 소비 공간
  desc: 진슈가이 한복판에 자리한 가장 트렌디하고 화려한 의류 매장입니다. 이곳의 거울 앞에서는 누구나 평소보다 백배는 아름다워 보이는 마법 같은 기분을 느낄 수 있습니다. 특별한 데이트를 위해 평소라면 절대 시도하지 않았을, 아주 약간 과감하고 매혹적인 의상을 기꺼이 선택하게 만드는 신기한 마력이 있는 곳입니다.
  name: 부티크 '비너스의 요람' (옷가게)
  num: 5
  events:
  - "지퍼 헬프: 탈의실 안에서 원피스 지퍼가 올라가지 않아, 파트너를 안으로 끌어들여 도움을 받음."
  - "란제리 샵 실수: 평범한 옷가게인 줄 알고 들어간 코너가 엄청나게 과감한 속옷 코너라 서로 눈치를 봄."
  - "착의의 마법: 평소 입지 않던 화려하고 노출도 높은 옷을 입고 나왔을 때, 이성을 잃은 파트너의 뜨거운 시선을 받음."
  - "넥타이 매주기: 파트너의 옷 매무새를 다듬어 주거나 넥타이를 매주며, 자연스럽게 목을 끌어안는 각도가 됨."
  - "사이즈 오해: 점원이 가슴이나 허리 사이즈를 직접 잴 때 민망해하며 파트너의 시선을 가림."
  - "보이프렌드 핏: 파트너의 커다란 겉옷을 장난삼아 걸쳐 보았는데, 너무 '그에게 잡아먹힌 여자' 같아 보여 묘한 기류가 흐름."
  - "탈의실 동시 입장: 좁은 피팅룸에 실수로(혹은 고의로) 같이 들어가 천 한 장을 사이에 두고 숨을 죽임."
  - "초커/목걸이 착용: 목걸이를 걸어주다 목덜미에 입술이 스치며, 마치 목줄을 채우는 듯한 소유욕을 자극함."
  - "거울 앞 백허그: 거울을 보며 옷이 어울리는지 묻는데, 파트너가 뒤에서 허리를 끌어안고 어깨에 턱을 괴고 있음."
  - "충동구매의 대가: '이거 사줄 테니까, 오늘 밤엔 이 옷 입어줘'라는 조건부 선물 이벤트."
- category: 상업 / 소비 공간
  desc: 언제나 아름다운 약사님이 상주하고 있는 24시간 심야 약국입니다. 평범한 감기약은 물론이고, 밤을 잊은 청춘들을 위한 '특제 에너지 보충제'나 '로맨스 향수' 같은 재미있는 상품들을 판매합니다. 이 약국의 드링크를 마시면 유독 가슴이 두근거리고 얼굴이 달아오르는 등 활력이 넘치게 됩니다.
  name: 심야 약국 '알케미스트'
  num: 6
  events:
  - "각성 드링크 오음: 피로회복제인 줄 알고 마신 약이 하필 '에너지 1000% 아드레날린(강력 각성) 보충제'여서 몸이 달아오름."
  - "연고 발라주기: 가벼운 찰과상에 약사 대신 파트너가 연고를 발라주며, 아프지 않게 환부에 입김을 불어줌."
  - "페로몬 향수 시향: 호기심에 뿌린 '로맨스 향수' 냄새 때문에 상대방이 갑자기 짐승처럼 돌변할 뻔함."
  - "체온계의 진실: 감기인 줄 알고 체온을 쟀는데, 약사가 '아프신 게 아니라 옆에 계신 분 때문에 흥분하신 거네요.'라고 팩트폭력을 날림."
  - "특별한 코너 습격: 길을 잃어 약국 구석의 '특별한 상품' 코너에 들어갔다가 어색해진 채 상상력을 자극당함."
  - "수면 유도제 부작용: 약을 먹고 급격히 졸음이 몰려와 약국 앞 벤치에서 상대방의 무릎을 베고 잠듦."
  - "입술 보호제 공유: 건조한 입술에 립밤을 듬뿍 바른 뒤, '너도 바를래?'라며 입술로 직접 립밤을 옮겨줌."
  - "우산 대신 가운: 갑작스러운 폭우에 우산을 사려 했으나 품절되어, 약사가 빌려준 커다란 비닐 가운 하나를 뒤집어쓰고 뜀."
  - "맥박 측정: 진정제를 사러 왔는데 약사가 '두 분 맥박이 완전히 똑같이 뛰고 있네요.'라며 운명적인 분위기를 조성함."
  - "숙취 해소의 핑계: 술에 취해 약국에 들렀다가, 취기를 핑계로 파트너의 뺨에 계속 뽀뽀를 해댐."
- category: 상업 / 소비 공간
