  - "더위와 탈의: 라이브 하우스의 열기 때문에 겉옷을 벗어 던지고 민소매나 얇은 티셔츠 차림이 되어 맨살이 맞닿음."
  - "열기 식히기: 공연장 밖으로 나와 시원한 밤공기를 마시며 벽에 기대어 섰다가, 나른해진 분위기 속에서 부드럽게 입을 맞춤."
- category: 방송 / 엔터테인먼트 구역
  desc: 럭셔리한 분위기의 프라이빗 심야 실내 수영장입니다. 아름다운 무드등과 부드러운 물결이 완벽한 분위기를 자아내며, 예쁜 수영복을 입고 인증샷을 남기기 좋은 핫플레이스입니다. 특별한 입욕제가 풀린 따뜻한 물놀이를 즐기며, 썸타는 연인과 단둘이 달콤하고 시원한 한밤의 바캉스를 즐길 수 있습니다.
