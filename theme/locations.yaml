- category: 항구 및 은밀한 구역
  desc: 방파제 끝에 덩그러니 놓인 낭만적인 낡은 등대입니다. 현지인들 사이에서는 '최고의 고백 명소'로 불리며, 등대의 붉은 불빛 아래서 마음을 전하면 숨겨왔던 솔직한 감정들이 마법처럼 쏟아져 나온다고 합니다. 사랑에 빠진 연인이라면 밤바다를 배경으로 용기를 내보기 좋은 곳입니다.
  name: 비포(緋浦) 끝자락의 버려진 등대
  num: 13
  events:
  - "붉은 불빛의 저주: 등대의 붉은빛이 몸을 비추는 순간, 참아왔던 독점욕이 폭발해 상대에게 강제로 키스함."
  - "나선 계단의 어부바: 가파르고 좁은 계단을 오르다 다리가 풀려, 결국 등에 업힌 채 가슴의 감촉을 고스란히 전함."
  - "정상에서의 포옹: 꼭대기에 부는 강풍 때문에 날아가지 않으려고 서로의 허리를 생명줄처럼 꽉 끌어안음."
  - "문 잠김 해프닝: 녹슨 철문이 바람에 닫혀버려, 아무도 오지 않는 등대 꼭대기에서 둘만의 뜨거운 밤을 보내게 됨."
  - "비밀의 낙서: 등대 벽에 이전에 다녀간 수많은 연인들의 설레는 낙서들을 보며 부끄러워하다 분위기를 탐."
  - "외투 공유: 하나의 커다란 겉옷 안에 두 명이 함께 들어가 어깨와 허리를 감싸고 체온을 나눔."
  - "외딴섬 효과: 아무도 볼 수 없는 높이와 고립감이 배덕감을 없애주어, 밖에서는 절대 못 할 대담한 다정한 행동을 벌임."
  - "추락 방지 핑계: 난간이 낮다는 핑계로 파트너를 백허그 상태로 결박하듯 잡고 놓아주지 않음."
  - "메아리치는 고백: 장난삼아 바다를 향해 'ㅇㅇㅇ 바보!'라고 외치려다 'ㅇㅇㅇ 사랑해!'라고 본심이 튀어나옴."
  - "일출의 마법: 추위에 떨며 서로의 체온을 탐하다가, 해가 뜨는 순간의 감동에 젖어 누가 먼저랄 것도 없이 입을 맞춤."
- category: 항구 및 은밀한 구역
  desc: 레트로한 감성이 물씬 풍기는 구도심 지하상가. 지금은 서브컬처 마니아들의 성지로 탈바꿈하여 개성 넘치는 팝업 스토어나 컨셉 카페들이 즐비합니다. 빡빡한 일상에서 벗어나고 싶은 학생들이 몰래 찾아와 약간의 화장과 코스프레를 즐기며 소소한 일탈의 재미를 느끼는 비밀 아지트입니다.
  name: 구(舊) 시온자와 지하상가 '언더 아케이드'
  num: 14
  events:
  - "메이드 카페 체험: 벌칙으로 고양이 귀와 꼬리를 달고 파트너에게 '모에모에 뀽'을 하며 수치심과 쾌감을 동시에 느낌."
  - "스티커 사진의 밀착: 비좁은 레트로 스티커 사진기 안에서 '가장 친밀한 포즈' 미션을 수행하느라 뺨과 뺨을 비빔."
  - "어둠 속의 손잡기: 낡은 상가 특유의 정전이 발생해, 깜깜한 복도에서 겁에 질려 파트너의 팔을 생명줄처럼 껴안음."
  - "덕력의 공유: 평소 숨기던 서브컬처 취향(만화책 등)을 들켜버리지만, 파트너가 오히려 흥미를 보이며 다가옴."
  - "가챠의 장난: 뽑기 기계에서 '오늘 하루 상대의 말만 듣는 티켓' 같은 장난감 아이템이 나와 묘한 롤플레잉이 시작됨."
  - "펌프 게임 스킨십: 리듬 게임을 하다가 동선이 겹쳐 서로의 허리를 잡거나 뒤에서 백허그 상태로 스텝을 밟음."
  - "타로카드 점보기: 수상한 점쟁이가 두 사람의 궁합을 보며 '오늘 밤 더 가까워지면 대길입니다'라고 선언함."
  - "비밀 아지트 감성: 셔터가 반쯤 내려간 폐업 상가 안에 숨어들어, 불량학생이 된 듯한 스릴과 배덕감을 즐김."
  - "매운 꼬치구이: 지하상가 명물인 엄청 매운 음식을 먹고 입술이 빨갛게 퉁퉁 부어, 본의 아니게 키스를 부르는 입술이 됨."
  - "마스크의 무장해제: 사람을 피해 썼던 마스크와 안경을 벗는 순간, 평소와 다른 매혹적인 모습에 파트너가 침을 꿀꺽 삼킴."
- category: 판타지 / 던전 / 비밀 공간
  desc: 옛 방공호를 개조하여 만든 시온자와 최대의 실내 미로 어트랙션입니다. 깜짝 등장하는 젤리 몬스터나 자욱한 안개 등 리얼한 특수 효과가 일품입니다. 어둡고 스릴 넘치는 분위기 덕분에, 겁이 많은 일행이 자연스럽게 곁에 있는 사람의 팔짱을 꽉 끼게 만들어주는 최고의 '밀착형' 데이트 코스입니다.
  name: 시청 지하의 거대 인공 던전 '라비린스'
  num: 15
  events:
  - "공포의 코알라 어택: 갑자기 튀어나온 좀비 몬스터에 놀라 파트너의 목에 매달려 다리로 허리까지 감싸버림."
  - "슬라임의 점액: 함정에서 쏟아진 끈적한 슬라임 용액이 옷을 다 적셔서, 몸의 굴곡과 속옷이 적나라하게 드러남."
  - "안개 속의 분실: 짙은 스모그 속에서 손을 놓쳐 당황하다가, 상대를 찾자마자 안도감에 울먹이며 입을 맞춤."
  - "비좁은 비밀 통로: 가슴과 가슴을 맞대고 게걸음으로만 통과할 수 있는 좁은 틈새를 지나며 심장 박동을 공유함."
  - "구출 롤플레잉: 일행 중 한 명이 마왕(?) 역의 직원에게 잡혀가고, 구출해 냈을 때 진짜 영웅과 히로인처럼 분위기에 취함."
  - "흔들다리 효과: 공포와 아드레날린 때문에 심장이 미친 듯이 뛰는 것을 '상대를 향한 두근거림'으로 뇌가 착각함."
  - "어둠 속의 촉각: 빛이 아예 없는 구간에서 오직 서로의 손길과 체온, 목소리에만 의존하며 감각이 극도로 예민해짐."
  - "함정 회피 다이빙: 바닥이 꺼지는 기믹을 피하려다 파트너의 위로 무겁게 쓰러져, 숨결이 닿는 거리에서 굳어버림."
  - "숨소리 공유: 괴물 역할을 하는 직원을 피해 캐비닛 안에 갇혀, 들키지 않으려고 입을 틀어막은 채 가쁜 숨을 몰아쉼."
  - "던전 클리어의 보상: 탈출에 성공한 직후, 다리가 풀려 바닥에 주저앉은 상대를 번쩍 안아 올리며 남성성을 과시함."
- category: 판타지 / 던전 / 비밀 공간
  desc: 밤에만 열리는 신비롭고 몽환적인 시립 온실입니다. 밤에 만개하는 진귀한 꽃들이 달콤하고 황홀한 향기를 내뿜습니다. 울창한 덩굴과 커다란 잎사귀들이 자연스러운 천연 가림막을 만들어 주어, 온실 속을 거닐다 보면 마치 둘만의 로맨틱한 비밀의 숲에 들어온 듯한 기분을 만끽할 수 있습니다.
  name: 시립 식물원 '이브의 온실'
  num: 16
  events:
  - "야간 개장의 몽환향: 밤에만 향기를 내뿜는 몽환적인 꽃향기를 맡고, 머리가 멍해지며 이성을 잃고 상대에게 다가가려 함."
  - "식물 촉수(?) 해프닝: 끈적하고 거대한 식물 덩굴에 다리가 얽혀 옴짝달싹 못 하게 되자, 파트너가 다리를 더듬어 풀어줌."
  - "열대 기후의 탈의: 온실 특유의 고온다습한 환경 탓에 땀이 비 오듯 쏟아져, 셔츠 단추를 여러 개 풀고 가쁜 숨을 내쉼."
  - "천연의 은폐물: 거대한 바나나 잎사귀 뒤에 숨자 밖에서는 완벽히 보이지 않는 둘만의 '에덴동산'이 만들어짐."
  - "꽃가루의 장난: 재채기를 유발하는 꽃가루 때문에 눈물이 맺힌 채 올려다보는 모습이 묘하게 색기 넘쳐 이성을 흔듦."
  - "식충 식물의 위협: 움직이는 장난감 식충 식물에 깜짝 놀라 파트너의 품으로 쏙 들어가 강하게 껴안음."
  - "습기에 젖은 옷: 습기가 높아지며 얇은 블라우스나 셔츠가 몸에 착 달라붙어, 만지지 않아도 몸매가 전부 느껴짐."
  - "떨어진 과즙: 천장에서 떨어진 달콤한 과일 즙이 쇄골 쪽에 맺히자, 무심코 그것을 손가락(혹은 입술)으로 닦아냄."
  - "인공 강우 스위치: 물뿌리개 시스템이 오작동하여 한밤중에 둘 다 흠뻑 젖어버리고, 서로의 평소와 다른 모습에 눈을 피함."
  - "원초적 본능: 짙은 녹음과 꽃내음에 둘러싸여, 문명 사회의 이성을 던져버리고 원초적인 끌림에 서로를 향해 다가가게 됨."
- category: 판타지 / 던전 / 비밀 공간
  desc: 시온자와 시내가 한눈에 내려다보이는 아름다운 산 중턱의 신사입니다. '이곳에서 맺은 인연은 절대 끊어지지 않는다'는 로맨틱한 전설 덕분에 늘 커플들로 붐빕니다. 가끔 신사의 짓궂은 여우 신령이 장난을 쳐서 방문객들이 가벼운 해프닝(옷이 젖거나 갑자기 넘어지는 등)을 겪으며 한층 더 가까워지게 만들어줍니다.
  name: 산꼭대기 '무스비(인연)의 신사'
  num: 17
  events:
  - "여우신의 장난: 여우 신령의 장난으로 신발 끈이 서로 묶여버려, 넘어지면서 아주 진한 스킨십을 하게 됨."
  - "소원 팻말의 진심: 'ㅇㅇㅇ와 평생 함께하게 해주세요' 같은 진한 속마음을 적은 팻말을 파트너에게 들켜 얼굴이 폭발함."
  - "돌계단의 어부바: 끝없는 계단을 오르다 다리에 쥐가 나고, 넓은 등에 업혀 올라가며 뺨을 목덜미에 비빔."
  - "갑작스러운 소나기: 비를 피해 낡은 신사 처마 밑으로 뛰어들어, 체온을 잃지 않으려 서로를 꼭 부둥켜안음."
  - "붉은 실의 결박: 인연을 맺어준다는 붉은 끈을 손가락에 감다가 장난이 과해져 양손이 결박당하는 꼴이 됨."
  - "대흉(大凶)의 액뜸: 뽑은 점괘가 '오늘 곁에 있는 사람과 특별한 시간을 보내지 않으면 재앙이 내림'이라는 어처구니없는 내용임."
  - "신주(神酒)의 위력: 참배 후 마신 한 모금의 성스러운 술이 엄청나게 독해서, 취기에 기대어 과감한 유혹을 시전함."
  - "인적 끊긴 뒤뜰: 참배객이 없는 신사 뒤쪽의 깊은 숲에서, 나무에 상대를 밀어붙이고 누구도 모르는 진한 키스를 나눔."
  - "무녀복의 판타지: 신사 체험으로 무녀복을 입었는데, 특유의 단정함 속에서 뿜어져 나오는 은은한 매력에 이성을 잃음."
  - "소원 빌기 핑계: 눈을 감고 손을 모은 채 기도하는 파트너의 무방비한 입술에 도둑고양이처럼 몰래 키스함."
- category: 방송 / 엔터테인먼트 구역
  desc: 시온자와 시민들의 사랑을 독차지하는 로컬 방송국입니다. 심야에 방영되는 아슬아슬하고 유쾌한 버라이어티 쇼 방청은 하늘의 별 따기일 정도로 인기가 많습니다. 아무리 돌발적이고 장난스러운 상황이 벌어져도 절대 미소를 잃지 않고 뉴스를 진행하는 아나운서들의 놀라운 프로 정신을 눈앞에서 감상할 수 있습니다.
  name: 진슈가이 로컬 방송국 '레드문 TV' 스튜디오
  num: 18
  events:
  - "키스타임 카메라: 방청 중 갑자기 '키스 캠'이 두 사람을 비추고, 수백 명의 관객이 환호하자 엉겁결에 진짜 입을 맞춤."
  - "커플 매칭 게임: 무대로 불려 나가 '얼굴로 젤리 옮기기' 같은 아슬아슬한 스킨십 게임을 반강제로 수행함."
  - "마이크 켜진 줄 모르고: 쉬는 시간에 마이크가 켜진 줄도 모르고 '오늘 밤엔 안 재워줄 거야' 같은 설레는 농담을 하다 방송을 탐."
  - "탈의실 조난: 구경하다가 좁은 게스트용 탈의실에 잘못 들어가 문이 잠기고, 어두운 공간에서 거친 숨소리만 들림."
  - "특수효과 오작동: 벚꽃잎이나 거품 특수효과가 두 사람에게만 폭탄처럼 쏟아져, 서로의 머리를 털어주며 묘한 기류가 생김."
  - "침대 세트장: 드라마 세트장의 푹신한 침대에 호기심으로 누워보았다가, 분위기에 휩쓸려 상대의 위로 올라탐."
  - "가짜 스캔들: 장난기 많은 MC가 '두 분, 어제 ㅇㅇ호텔에서 나오시는 거 봤어요!'라며 몰아가 얼굴이 새빨개짐."
  - "시선의 강탈: 조명 아래에 선 파트너가 연예인보다 훨씬 매력적이고 예뻐 보여서, 강렬한 독점욕이 차오름."
  - "대기실의 비밀: 아무도 없는 텅 빈 대기실 소파에서, 밖에서 들리는 스태프들의 발소리에 스릴을 느끼며 스킨십을 나눔."
  - "프로포즈 방송: 생방송 카메라를 빌려 평소의 장난기를 싹 빼고 진심으로 묵직한 고백을 던짐."
- category: 방송 / 엔터테인먼트 구역
  desc: 에너지 넘치는 인디 밴드와 로컬 아이돌들이 뜨거운 무대를 펼치는 지하 라이브 하우스입니다. 관객과 무대의 거리가 아주 가까워 일체감을 느낄 수 있으며, 화려한 조명과 함성 소리에 취해 공연을 관람하다 보면 무대 위 아이돌과 관객 모두가 평소의 부끄러움을 잊고 열정적으로 분위기에 빠져들게 됩니다.
