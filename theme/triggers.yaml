crisis_triggers:
- 육체적인 위기
- 정신적인 위기
first_triggers:
- '{name}가 치욕적인 습격의 위기에서 그에게 구출됨'
- '{name}를 끈질기게 따라붙던 치한으로부터 강렬하게 보호받음'
- '{name}가 끔찍한 사고를 당하기 직전, 그의 거친 손길에 의해 구원됨'
- '{name}을 해치려던 괴한을 그가 압도적인 무력으로 제압하며 구출함'
- '{name}가 폭우 속에서 의식을 잃고 쓰러진 것을 발견하고, 그가 헌신적으로 보살핌'
- '{name}을 밤길의 위험으로부터 구해내며 묘한 긴장감과 유대감이 형성됨'
- '{name}가 과로로 쓰러진 순간, 그가 나타나 그녀를 품에 안고 병원으로 옮김'
- '{name}가 절벽 끝에서 추락하려던 찰나, 그의 강한 팔이 그녀의 허리를 낚아챔'
- '{name}가 물에 빠져 허우적거릴 때, 그가 망설임 없이 뛰어들어 그녀를 품에 안고 구해냄'
- '{name}가 화염에 갇혀 절망하던 순간, 그가 벽을 부수고 들어와 그녀를 구해냄'
- '{name}가 밤길에 길을 잃고 공포에 떨 때, 그가 나타나 따뜻한 온기로 그녀를 감싸줌'
- '{name}가 삶의 의지를 잃고 극단적인 선택을 하려던 순간, 그가 강하게 제지하며 그녀를 붙잡음'
- '{name}가 부당한 괴롭힘을 당하던 현장에 그가 난입하여 그녀의 편이 되어줌'
- '{name}가 갑작스러운 발작으로 고통받을 때, 그가 침착하고 숙련된 솜씨로 응급처치를 해줌'
- '{name}가 혹한의 거리에서 체온을 잃어갈 때, 그가 자신의 옷을 벗어 덮어주고 온기를 나눠줌'
- '{name}가 실패의 절망 속에 울고 있을 때, 그가 다가와 조용히 어깨를 감싸며 위로함'
- '{name}을 위협하며 돈을 뺏으려던 강도를 그가 순식간에 제압하며 그녀를 보호함'
- '{name}가 알레르기로 숨이 가빠 고통스러워할 때, 그가 빠르게 약을 찾아내어 그녀의 생명을 구함'
- '{name}와 함께 엘리베이터에 갇혀, 폐쇄된 공간 속에서 서로의 숨소리를 느끼며 유대감이 생김'
- '{name}가 밤새 홀로 흐느끼는 소리를 듣고, 그가 조심스럽게 다가와 첫 대화를 건넴'
- '{name}가 세상 모두에게 외면당해 절망하며 울고 있을 때, 그만이 유일하게 손을 내밀어 줌'
- '{name}가 치명적인 실수로 공개적인 망신을 당할 위기에 처했을 때, 그가 기지를 발휘해 그녀의 품위를 지켜줌'
- '{name}가 공황 상태에 빠져 호흡 곤란을 일으킬 때, 그가 그녀를 강하게 끌어안아 진정시켜 줌'
- '{name}가 억울한 누명을 쓰고 사지로 몰렸을 때, 그가 결정적인 증거를 제시하며 그녀를 구원함'
