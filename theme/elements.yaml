body_change_signs:
  BSS:
  - 가슴 크기가 살짝 커진 것 같은 느낌
  - 엉덩이가 옷에 닿는 느낌이 달라짐
  - 거울 속 몸매가 어제보다 풍만해 보임
  메이드화:
  - 상대방 집에 방문하고 싶어하고 집안일을 하고 싶어한다.
  - 상대방이 힘들 때 위로하고 싶어짐.
  - 주인님이라는 단어를 쓰고 싶어한다.
  패션 취향 종속:
  - 남주가 지나가듯 칭찬한 옷 스타일만 계속 인터넷으로 검색함.
  - 옷장에서 평소 입던 단정한 옷들을 구석으로 치우기 시작함.
  - 파인 옷이나 짧은 치마를 입고 거울 앞에서 야한 포즈를 취해봄.
  마킹 전시 (소유권 과시):
  - 남주의 겉옷이나 체육복을 빌려 입고 돌려주기 싫어함.
  - 남주가 만졌던 목덜미나 쇄골을 자꾸 무의식적으로 만지작거림.
  - 목덜미가 잘 드러나는 오프숄더나 셔츠 상의를 고르게 됨.
  발정기 메이크업 (도화살):
  - 평소 안 바르던 투명하고 끈적한 립글로스를 사서 바르기 시작함.
  - 거울을 보며 눈가와 뺨에 붉은색 블러셔를 진하게 덧칠해봄.
  - 남주와 만날 때마다 화장실에서 입술과 눈화장을 수정하는 시간이 길어짐.
  방어력 제로 (무방비):
  - 얇은 옷을 입었을 때 속옷이 비쳐도 예전만큼 부끄럽지 않게 됨.
  - 더운 날 브래지어가 답답하게 느껴져 남주 앞에서도 느슨하게 있고 싶어짐.
  - 남주 외의 타인이 자신의 노출을 쳐다보는 것에 둔감해짐.
  헤어 및 체향 동기화:
  - 남주가 쓰는 샴푸나 바디워시 브랜드를 은근슬쩍 물어봄.
  - 남주가 좋아하는 헤어스타일(단발 등)로 확 잘라버릴까 매일 고민함.
  - 남주의 체취가 묻은 옷을 껴안고 냄새를 들이마시는 횟수가 잦아짐.
  표정의 슬라임화 (트로가오):
  - 남주를 쳐다볼 때 나도 모르게 입이 살짝 벌어지고 호흡이 가빠짐.
  - 눈에 힘이 풀리고 시야가 몽롱해지는 열감을 자주 느낌.
  - 거울 속 자신의 눈빛이 어딘가 열에 들뜨고 야해 보인다고 느낌.
  승부속옷 상시화:
  - 서랍에서 위아래 짝이 안 맞는 평범한 속옷들을 전부 버리기 시작함.
  - 화려한 레이스나 티팬티 같은 과감한 디자인의 속옷에만 눈길이 감.
  - 언제 무슨 일이 생길지 모른다는 기대감에 매일 아침 가장 야한 속옷을 고름.
  복종의 실루엣 (자세):
  - 남주 옆에 앉을 때 다리를 무의식적으로 꼬며 허벅지를 비비적거림.
  - 남주를 올려다볼 때 가장 애처롭고 예뻐 보이는 각도를 혼자 연습함.
  - 남주 앞에 서면 무의식적으로 허리를 휘게 하여 가슴을 내밀게 됨.
body_changes:
- name: BSS
  desc: 수수했던 소녀의 태를 완전히 벗고, 언제든 안길 수 있도록 골반과 가슴이 농익은 쭉쭉빵빵한 '여자'의 육체로 완전히 개조됨.
- name: 메이드화
  desc: 남주의 헐렁한 셔츠 한 장이나 앞치마만 알몸에 걸치는 등, 시각적으로 완벽한 '그만의 전속 아내(메이드)' 코스프레에 중독되어 일상화됨.
- name: 패션 취향 종속
  desc: 과거의 단정한 패션은 사라지고, 오직 남주의 성적 취향(타이트한 니트, 짧은 스커트 등)에 완벽하게 맞춰진 색기 넘치는 사복으로 옷장이 100% 물갈이됨.
- name: 마킹 전시 (소유권 과시)
  desc: 남주가 남긴 키스 마크가 은근슬쩍 보이도록 셔츠 단추를 풀고 다니며, 헐렁한 남주의 후드티를 입어 '그의 침대에서 일어난 여자'임을 시각적으로 무자비하게 과시함.
- name: 발정기 메이크업 (도화살)
  desc: 언제든 키스할 수 있도록 끈적하고 번들거리는 입술과, 상시 흥분한 것처럼 눈가에 붉은 기운이 감도는 색기 넘치는 메이크업이 기본값이 됨.
- name: 방어력 제로 (무방비)
  desc: 남주 이외의 시선은 곤충 보듯 신경 쓰지 않게 되어, 얇은 상의 아래로 속옷 라인이 적나라하게 비치거나 아예 노브라로 다니는 등 무방비한 시각적 노출 상태가 됨.
- name: 헤어 및 체향 동기화
  desc: 머리스타일이 남주의 이상형으로 완전히 바뀌고, 지나갈 때마다 본연의 향기가 아닌 '남주가 쓰는 남성용 샴푸/스킨 냄새'가 강하게 풍겨 소유권이 넘어갔음을 증명함.
- name: 표정의 슬라임화 (트로가오)
  desc: 평소의 총기 있던 눈빛은 사라지고, 항상 나른하게 반쯤 감긴 촉촉한 눈동자와 살짝 벌어진 입술을 한 '완전히 함락된 암컷' 특유의 요염한 표정으로 굳어짐.
- name: 승부속옷 상시화
  desc: 언제 어디서 덮쳐져도 좋도록 365일 내내 노출이 심하고 화려한 승부속옷만을 착용하며, 얇은 겉옷 위로 야한 속옷의 실루엣이 상시 굴곡지게 드러남.
- name: 복종의 실루엣 (자세)
  desc: 멀리서 실루엣만 봐도 요추를 휘게 하여 가슴과 엉덩이를 강조하고, 항상 남주를 올려다보는 순종적이고 굴곡진 자세로 굳어져 있어 '누군가에게 길들여진 여자'임이 적나라하게 드러남.
change_awareness_options:
- 무의식적으로 변화가 진행됨. {name}은 자신의 신체와 정신적 변화를 스스로 인지하지 못하고, 주변에서 자연스럽게 받아들임
- 이성적으로 변화를 파악함. {name}은 거울과 감각을 통해 자신의 신체와 정신적 변화를 차근차금 인지하고, 그 변화에 놀라거나 저항하려는 시도를 함
corruption_flows:
- desc: 사랑에 일방적으로 저항하지 못하고 따라감
  flow_template: '{name}은 {name2}의 사랑에 저항하지 못하고 자연스럽게 따라감. 점차 본능적으로 {name2}를 추구함.'
  name: 일방적 순종
- desc: 사랑에 1번 강하게 저항해서 일상생활로 돌아가지만 주인공이 상대방에게 제발로 돌아감
  flow_template: '{name}은 {name2}의 사랑에 강하게 저항한 후 일상으로 돌아감. 하지만 곧 {name}이 {name2}에게 제발하며 자의로 돌아옴.'
  name: 역전 회귀
- desc: 사랑에 1번 강하게 저항하고 일상생활로 돌아가지만 상대방의 공격에 굴복함
  flow_template: '{name}은 {name2}의 사랑에 강하게 저항한 후 일상으로 돌아감. 하지만 {name2}의 적극적인 접근에 굴복하며 완전히 함락됨.'
  name: 공격 굴복
- desc: 사랑에 여러번 저항하지만 점점 약해지고 4-5번 정도에는 굴복함
  flow_template: '{name}은 {name2}의 사랑에 여러 번 저항하지만 점차 마음이 약해짐. 4-5번째 시도에서 완전히 굴복함.'
  name: 점점 약해지기
corruption_tones:
- 서서히 끓어오르는 열정
- 갑작스러운 폭발과 그 여파
- 교차하는 사랑과 연민
- 조용한 축적과 한 번의 붕괴
- 지속적인 작은 행복의 누적
- 상호 경쟁과 우위 다툼
- 서로의 냄새와 체취에 대한 집착
- 신체 접촉의 빈도 증가에 따른 예민화
corruption_types:
- desc_template: 지성, 이성, 도덕심은 그대로이지만 {name2}의 명령이나 사랑이 가장 중요함. 수동적이고 순종적으로 사랑에 빠짐
  name: 순애 메가데레
default_outfit: 캐주얼
interaction_styles:
- 조용한 관찰에서 시작해 점점 적극적으로 접근
- 우연한 접촉이 반복되며 관계가 깊어짐
- 서로를 의식하는 시선 교환이 빈번해짐
- 작은 경쟁심과 우위 다툼이 사랑의 긴장감으로 전환
- 상대방의 취향을 맞춰보려는 시도가 사랑으로 이어짐
- 상대방의 변화를 먼저 발견하고 놀람
- 서로의 숨겨진 면을 하나씩 벗겨냄
internal_conflicts:
- 이성과 본능의 싸움
- 자존심과 사랑의 충돌
- 정숙함과 사랑스러움의 공존
- 상대방에 대한 사랑과 자신의 변화에 대한 당혹
- 과거의 경험과 새로운 감각의 비교
- 사랑스러운 자신을 숨기려는 노력과 실패
location_moods:
- 조용하고 폐쇄된 실내 공간
- 붐비는 거리와 공공장소에서의 우연
- 자연 속에서의 고립과 친밀함
- 일상적인 공간(집, 직장, 학교)에서의 변화
- 새벽과 밤의 고요함 속에서 깊어지는 관계
- 여러 장소를 이동하며 관계가 진전됨
outfit_by_job:
  고등학생: 고등학교 교복
  교수: 단정한 셔츠에 재킷
  평범한 회사원: 남성 정장, 검은 색
  구미호: 한복 스타일 블라우스
  귀족: 장식된 정장
  노예 상인: 풍부한 장식의 정장
  대학생: 캐주얼
  마법사: 마법사 로브
  마왕: 왕관과 망토
  마피아: 슬림 핏 수트
  매드 사이언티스트: 실험실 코트에 안전경
  밀매상: 간단한 재킷
  뱀파이어: 고급 블랙 수트
  사관: 교복
  선생: 단정한 셔츠
  수험생: 캐주얼
  야쿠자: 슬림 핏 슈트
  의사: 화이트 코트
  재벌: 고급 수트
  조폭: 폴로 셔츠
  중학생: 중학교 교복
  클론 제조자: 실험실 코트
  퇴마사: 퇴마사 의복
  페로몬 조절 능력자: 세련된 캐주얼
  폭군: 왕관과 장식된 망토
  학생: 교복
  해커: 후드티
  회사원: 비즈니스 정장
  회장: 고급 비즈니스 수트
sensory_emphasis:
- 후각(체취, 향수, 냄새)
- 촉각(피부 접촉, 체온, 질감)
- 시각(시선, 몸매, 변화하는 외모)
- 청각(숨소리, 말투 변화, 신음)
- 미각(키스, 체액, 맛)
- 후각 + 촉각의 복합 감각
- 시각 + 청각의 복합 감각
