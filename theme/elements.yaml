sensory_emphasis:
- 후각(체취, 향수, 냄새)
- 촉각(피부 접촉, 체온, 질감)
- 시각(시선, 몸매, 변화하는 외모)
- 청각(숨소리, 말투 변화, 신음)
- 미각(키스, 체액, 맛)
- 후각 + 촉각의 복합 감각
- 시각 + 청각의 복합 감각
