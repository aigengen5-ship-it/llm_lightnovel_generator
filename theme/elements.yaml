body_change_signs:
  BSS:
  - 가슴 크기가 살짝 커진 것 같은 느낌
  - 엉덩이가 옷에 닿는 느낌이 달라짐
  - 거울 속 몸매가 어제보다 풍만해 보임
  메이드화:
  - 상대방 집에 방문하고 싶어하고 집안일을 하고 싶어한다.
  - 주인님이라는 단어를 쓰고 싶어한다.
body_changes:
- desc: 쭉쭉빵빵한 몸매로 바뀜.
  name: BSS
- desc: 메이드 코스프레(?)에 중독됨.
  name: 메이드화
change_awareness_options:
- 무의식적으로 변화가 진행됨. {name}은 자신의 신체와 정신적 변화를 스스로 인지하지 못하고, 주변에서 자연스럽게 받아들임
- 이성적으로 변화를 파악함. {name}은 거울과 감각을 통해 자신의 신체와 정신적 변화를 차근차금 인지하고, 그 변화에 놀라거나 저항하려는 시도를 함
corruption_flows:
- desc: 사랑에 일방적으로 저항하지 못하고 따라감
  flow_template: '{name}은 {name2}의 사랑에 저항하지 못하고 자연스럽게 따라감. 점차 본능적으로 {name2}를 추구함.'
  name: 일방적 순종
- desc: 사랑에 1번 강하게 저항해서 일상생활로 돌아가지만 주인공이 상대방에게 제발로 돌아감
  flow_template: '{name}은 {name2}의 사랑에 강하게 저항한 후 일상으로 돌아감. 하지만 곧 {name}이 {name2}에게 제발하며 자의로 돌아옴.'
  name: 역전 회귀
- desc: 사랑에 1번 강하게 저항하고 일상생활로 돌아가지만 상대방의 공격에 굴복함
  flow_template: '{name}은 {name2}의 사랑에 강하게 저항한 후 일상으로 돌아감. 하지만 {name2}의 적극적인 접근에 굴복하며 완전히 함락됨.'
  name: 공격 굴복
- desc: 사랑에 여러번 저항하지만 점점 약해지고 4-5번 정도에는 굴복함
  flow_template: '{name}은 {name2}의 사랑에 여러 번 저항하지만 점차 마음이 약해짐. 4-5번째 시도에서 완전히 굴복함.'
  name: 점점 약해지기
corruption_tones:
- 서서히 끓어오르는 열정
- 갑작스러운 폭발과 그 여파
- 교차하는 사랑과 연민
- 조용한 축적과 한 번의 붕괴
- 지속적인 작은 행복의 누적
- 상호 경쟁과 우위 다툼
- 서로의 냄새와 체취에 대한 집착
- 신체 접촉의 빈도 증가에 따른 예민화
corruption_types:
- desc_template: 지성, 이성, 도덕심은 그대로이지만 {name2}의 명령이나 사랑이 가장 중요함. 수동적이고 순종적으로 사랑에 빠짐
  name: 순애타락
default_outfit: 캐주얼
interaction_styles:
- 조용한 관찰에서 시작해 점점 적극적으로 접근
- 우연한 접촉이 반복되며 관계가 깊어짐
- 서로를 의식하는 시선 교환이 빈번해짐
- 작은 경쟁심과 우위 다툼이 사랑의 긴장감으로 전환
- 상대방의 취향을 맞춰보려는 시도가 사랑으로 이어짐
- 상대방의 변화를 먼저 발견하고 놀람
- 서로의 숨겨진 면을 하나씩 벗겨냄
internal_conflicts:
- 이성과 본능의 싸움
- 자존심과 사랑의 충돌
- 정숙함과 사랑스러움의 공존
- 상대방에 대한 사랑과 자신의 변화에 대한 당혹
- 과거의 경험과 새로운 감각의 비교
- 사랑스러운 자신을 숨기려는 노력과 실패
location_moods:
- 조용하고 폐쇄된 실내 공간
- 붐비는 거리와 공공장소에서의 우연
- 자연 속에서의 고립과 친밀함
- 일상적인 공간(집, 직장, 학교)에서의 변화
- 새벽과 밤의 고요함 속에서 깊어지는 관계
- 여러 장소를 이동하며 관계가 진전됨
