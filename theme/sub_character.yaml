# 서브 캐릭터(3인자) 데이터 — chr_num3=1 시 theme_gen_auto에서 사용
# a) 주인공과의 관계 (관계에서 성별/나이 파생), c) 스토리 전개에서 '망가지는' 역할
#
# 관계 항목 필드:
#   label:     관계 라벨 (프롬프트에 사용)
#   gender:    고정 성별 (남자/여자), null = 50/50 랜덤
#   age_delta: [min, max] 주인공 나이 기준 상대 오프셋 (최종 18~60 clamp)
#   job_sync:  true = 서브 캐릭터 직업을 주인공 직업과 동기화 (사회적/권력적 관계)

# ==========================================
# a) 주인공과의 관계 (배덕감 & 권력 & 하렘 기믹)
# ==========================================
sub_relationships:
  # [기본 혈연/애정 관계]
  - label: 가족 (여동생)
    gender: 여자
    age_delta: [-6, -1]
  - label: 가족 (남동생)
    gender: 남자
    age_delta: [-6, -1]
  - label: 가족 (언니)
    gender: 여자
    age_delta: [1, 6]
  - label: 가족 (오빠)
    gender: 남자
    age_delta: [1, 6]
  - label: 가족 (어머니)
    gender: 여자
    age_delta: [18, 25]
  - label: 가족 (아버지)
    gender: 남자
    age_delta: [18, 25]
  - label: 연인/정혼자
    gender: 남자          # 주인공이 여자이므로 연인은 남자 고정
    age_delta: [-2, 2]
  - label: 소꿉친구
    gender: null
    age_delta: [-2, 2]
  # [사회적/권력적 관계] (job_sync: 주인공 직업과 동기화)
  - label: 상사/주군 (여왕, 학생회장 등)
    gender: null
    age_delta: [1, 10]
    job_sync: true
  - label: 부하/후배 (메이드, 부원 등)
    gender: null
    age_delta: [-5, 0]
    job_sync: true
  - label: 스승/사부
    gender: null
    age_delta: [3, 15]
    job_sync: true
  - label: 라이벌 (선의의 경쟁자)
    gender: null
    age_delta: [-2, 2]
    job_sync: true
  - label: 같은 조직 (원수/배신자)
    gender: null
    age_delta: [-2, 2]
    job_sync: true
  # [특수/어두운 관계]
  - label: 짝사랑(BSS) 피해자
    gender: null
    age_delta: [-2, 2]
  - label: 약점을 잡고 있는 자
    gender: null
    age_delta: [-2, 2]
  # [20260914] 삼각관계(진슈가이 id=2) 전용 연적 — 하렘 결말을 고려해 여자 고정
  - label: 연적 (진슈가이 소속 애정공세형)
    gender: 여자
    age_delta: [-2, 2]

# ==========================================
# c) 스토리 전개에서 서브 캐릭터가 '망가지는' 역할 (하렘/타락/능욕 클리셰)
# ==========================================
# 역할 항목 필드:
#   name:          역할 이름
#   desc:          역할 설명
#                  → '초반-중반-엔딩' 3단계 흐름 역할은 "초반: ... / 중반: ... / 엔딩: ..." 형식으로 작성
#                    (theme_gen_auto.py의 기-승/전/결 단계와 대응)
#   jinshugai_ids: 이 역할이 잘 어울리는 jinshugai 템플릿 ID (theme/theme_templates.yaml)
#                  → Step1에서 config.selected_jinshugai_id와 매칭되는 역할 우선 선택
sub_corruption_roles:
  # [동반 타락 및 하렘 융합]
  - name: 주인공과 함께 타락함
    desc: "초반: 평범한 동반자로 저항하며 주인공을 지키려 함 / 중반: 주인공의 타락에 휘말려 첫 노출/첫 굴복을 함께 겪음 / 엔딩: 주인공과 서로의 몸을 탐하며 짐승처럼 같이 망가짐."
    jinshugai_ids: [1, 3, 4, 6, 8, 10, 11]   # 일상/밀실/고립/아이템(함께 중독)/일상침식/코즈믹/군중 — '함께 노출' 시나리오
  - name: 하렘 경쟁 (발정 폭주)
    desc: "초반: 평범하게 주인공을 지키려 함 / 중반: 주인공이 적에게 조교당하며 쾌락을 느끼는 것을 보고 마음이 흔들리기 시작함 / 엔딩: '나도 저렇게 기분 좋게 해줘!'라며 이성을 잃고 스스로 쾌락의 노예로 자원함."
    jinshugai_ids: [1, 5, 6, 8, 11]          # 순애/조교/아이템(경쟁적 자원)/일상침식/군중공개 — 타락 지켜보고 자원
  - name: 주인공을 위한 고기방패 (희생적 타락)
    desc: "초반: 평범하게 주인공을 지키려 함 / 중반: 주인공이 타락하는 것을 막기 위해 대신 적의 제물이 됨 / 엔딩: 완벽한 육변기로 조교되어 구제 불능 상태가 되고, 주인공을 구하려는 시도는 비극적으로 실패함."
    jinshugai_ids: [5, 7]                 # 조교/잠입 — 대신 납치/조교당함 ([20260914] id=2 러브코메디삼각관계와 톤 충돌로 제외)
  # [NTR 및 관음 기믹]
  - name: 강제 관음의 절망 (눈앞의 네토리)
    desc: "초반: 평범하게 주인공을 구하려 함 / 중반: 사지가 묶인 채 주인공의 타락 과정을 강제 관음하게 됨 / 엔딩: 주인공이 적에게 완벽한 암컷으로 타락하여 헐떡이는 모습을 끝까지 지켜보며 멘탈이 완전히 붕괴됨."
    jinshugai_ids: [3, 5, 11]             # 밀실/조교/군중공개 — 묶인 채 지켜봄
  - name: 쾌락에 의한 주인공 배신 (역 NTL)
    desc: "초반: 주인공을 지키려 함 / 중반: 적이 주는 압도적인 쾌락에 점차 굴복해버림 / 엔딩: '너보다 이쪽이 훨씬 기분 좋아♡'라며 주인공을 버리고 조롱함."
    jinshugai_ids: [1, 6, 7, 9]              # 순애(연인 NTR)/이적/아이템(쾌락 위해 배신)/간첩 배신/권력역전 ([20260914] id=2 제외)
  # [세뇌 및 적대화 기믹]
  - name: 적의 사냥개가 됨 (세뇌 역강간)
    desc: "초반: 평범한 동반자로 함께 시작함 / 중반: 적에게 마인드 브레이크 당하며 적의 편으로 전향함 / 엔딩: 가장 앞장서서 주인공을 붙잡고 억지로 범하며 주인공을 타락시키는 선봉장이 됨."
    jinshugai_ids: [5, 6, 7, 9, 10]          # 조교(마인드브레이크)/아이템(중독 선봉장)/전향/강자 붕괴/심연 세뇌
  - name: 인질 및 협박의 도구 (자발적 굴복)
    desc: "초반: 평범하게 주인공과 함께 있음 / 중반: 목숨이나 정조가 적에게 인질로 잡혀 협박을 받음 / 엔딩: 주인공이 어쩔 수 없이 적에게 굴복하고 스스로 다리를 벌리게 만드는 방아쇠 역할을 하며, 자신도 인질 상태에서 굴복함."
    jinshugai_ids: [5, 7, 10]                # 조교/납치/잠입/심연 — 인질 시나리오 ([20260914] id=2 제외)
  # [복수 및 파멸 기믹]
  - name: 원수를 갚는 도구의 타락
    desc: "초반: 상대방에게 처참하게 배신당한 후, 주인공의 힘을 빌려 복수하려 함 / 중반: 복수 과정에서 적의 잔혹함과 쾌락에 점차 취해감 / 엔딩: 복수 도구가 아니라 쾌락에 굴복한 끔찍한 사디스트 괴물로 변모함."
    jinshugai_ids: [4, 7, 9]                 # 원수관계/잠입/권력역전 — 복수 테마 ([20260914] id=2 제외)
  - name: BSS의 비참한 최후 (열폭 타락)
    desc: "초반: 평범하지만 주인공을 뺏겼다는 질투심을 품고 있음 / 중반: 질투심에 미쳐 적과 계약함 / 엔딩: 결국 적에게 이용만 당하고 쾌락의 도구로 비참하게 쓰여버림."
    jinshugai_ids: [1, 6, 8]              # 순애(질투)/아이템 계약/일상
  - name: 구원 실패의 충격 (도덕 붕괴)
    desc: "초반: 평범하게 주인공을 구출하러 옴 / 중반: 주인공이 이미 적의 완벽한 쾌락 노예가 된 것을 발견하고 충격을 받음 / 엔딩: 주인공이 '돌아가, 지금이 더 행복해'라고 말하는 것에 스스로도 이성을 놓아버림."
    jinshugai_ids: [3, 4, 5, 6, 11]          # 밀실/무인도/조교/아이템(뇌 녹은 주인공)/공개 — 구출 시나리오
  # [서브 캐릭터 변모 3단계 흐름 (초반-중반-엔딩, 기-승/전/결 대응)]
  - name: 평범함을 지키는 수호자 (비극적 충격)
    desc: "초반: 평범한 일상을 유지하며 상황을 저항하고 주인공을 지키려 함 / 중반: 주인공의 타락 진행에 충격을 받고 필사적으로 구출/저지를 시도하지만 번번이 실패함 / 엔딩: 주인공의 타락을 포기(구원 실패)하고 비극적 요소가 강화됨 — 주인공의 타락을 끝까지 지켜보는 증인이 되거나, 절망에 스스로 무너짐."
    jinshugai_ids: [3, 5, 7, 10]             # 밀실/조교/잠입/코즈믹 — 구출이 어려운 고립/세뇌 시나리오
  - name: 이미 타락한 공범 (개방형, 타락 조력자)
    desc: "초반: 이미 타락한 상태임을 처음부터 드러냄 (적의 노예/사냥개 등), 주인공은 불길함을 느낌 / 중반: 주인공의 타락을 적극적으로 유도하고 돕으며 '쾌락'을 시연함 / 엔딩: 주인공의 타락을 완성시키고, 둘은 함께 타락한 쌍이 됨."
    jinshugai_ids: [5, 6, 9, 10]             # 조교/아이템/권력역전/코즈믹 — 이미 적편에 붙은 서브
  - name: 숨겨진 타락자 (은닉형, 타락 조력자)
    desc: "초반: 겉으로는 완전히 평범하지만 사실 이미 타락해 있었음 (비밀로 적의 노예 등), 주인공을 은근히 이끎 / 중반: 주인공의 타락이 진행되며 위장이 서서히 벗겨지고 조력이 노골화됨 / 엔딩: 진짜 모습이 완전히 드러나 주인공의 타락을 이끄는 핵심 조력자로 확정됨."
    jinshugai_ids: [1, 7, 8, 9]              # 순애/잠입/일상침식/권력역전 — 가까이에 숨은 타락자
  - name: 주인공보다 먼저 타락함 (숙명의 전조)
    desc: "초반: 평범한 동반자로 함께 시작함 / 중반: 주인공보다 빠르게 타락하여 주인공에게 '이것이 네 미래'라는 경고를 보여주며 주인공의 저항을 자극함 / 엔딩: 완전히 타락한 상태로, 주인공의 마지막 굴복을 목격하거나 직접 유도함."
    jinshugai_ids: [4, 8, 11]                # 고립/일상침식/군중 — 같은 상황에 노출되는 동반자
  # [20260914] 진슈가이 id=2 (삼각관계 러브코메디) 전용 — 이 역할은 id=2 에서만 선택된다
  - name: 삼각관계 연적 (경쟁에서 공범으로)
    desc: "초반: 진슈가이에서 익힌 천박하고 음탕한 말투와 서슴없는 스킨십으로 상대방에게 노골적인 애정공세를 펴며 주인공의 열폭을 유도함(악의는 없음) / 중반: 주인공이 점점 과감해지는 것을 동경과 경쟁심으로 지켜보며 '나보다 잘하잖아!'를 시전하고, 결정적인 순간 주인공을 밀어주지 못해 발을 동동 구름 / 엔딩: 반드시 선택된 결말(endings)을 따를 것 — 하렘 결말이면 주인공과 나란히 연인이 되는 공범, 단애 결말이면 백기투항 후 두 사람의 가장 열렬한 응원이 된다."
    jinshugai_ids: [2]                       # [20260914] 삼각관계 전용
