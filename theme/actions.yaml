1:
  1:
  - num: 1
    text: 갑작스러운 소나기에 좁은 우산을 나눠 쓰다, 상대방의 젖은 어깨가 닿을 때마다 심장 박동이 빨라지는 것을 느낌
  - num: 2
    text: 야근으로 지쳐 잠든 상대방의 뺨에 묻은 볼펜 자국을 지워주려다, 숨결이 얽힐 만큼 얼굴을 가까이 가져다 댐
  - num: 3
    text: 상대가 끓여준 찌개의 간을 본다며 그가 쓰던 숟가락을 그대로 입에 넣고 간접키스를 함
  - num: 4
    text: 소파에서 영화를 보던 중 무심코 손을 뻗었다가 서로의 손가락이 얽혔지만, 아무도 먼저 손을 빼지 않음
  - num: 5
    text: 책상 위로 떨어지는 물건을 동시에 잡으려다 이마를 부딪치고, 얼굴이 붉어진 채 서로의 체취를 맡음
  - num: 6
    text: 길을 걷다 오토바이가 지나가자 상대방이 허리를 감싸 당겼고, 그의 가슴팍에 안긴 채 묘한 안도감을 느낌
  - num: 7
    text: 요리를 하다가 칼에 살짝 베인 상대의 손가락을 본능적으로 자기 입에 넣고 피를 빨아줌
  - num: 8
    text: 늦은 밤 통화 중, 하품 소리와 섞여 나온 자신의 나른하고 색기 어린 한숨 소리에 스스로 놀라 전화를 황급히 끊음
  - num: 9
    text: 상대의 자취방 청소를 도와주다 그의 체취가 짙게 밴 티셔츠를 발견하고 몰래 얼굴을 묻어 냄새를 맡음
  - num: 10
    text: 머리카락에 붙은 먼지를 떼어주려는 상대방의 손길에 반사적으로 눈을 감으며 턱을 치켜듦
