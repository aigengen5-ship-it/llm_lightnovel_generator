jinshugai_templates:
- concept: 주인공은 작은 계기로 인해 점점 상대방에 대한 애정이 깊어지고, 상대방의 결정적 도움 끝에 주인공을 상대방 전용의 사랑스러운 연인으로 변모시키는 러브코메디. 
  import_point: 러브코메디이므로, 상대방의 모든 행동과 생각은 주인공에 대한 애정에서 기반하며, 주인공은 평범한 일상을 유지하면서도 상대방 앞에서 사랑스러운 연인이 된다.
  id: 1
  first_event:
  - 주인공이 치한에게 추행당할 때 상대방이 도와줌.
  - 주인공이 밤 늦게 비를 맞으며 울고 있을 때 상대방이 도와줌
  - 주인공이 강간당할 위기에서 상대방이 도와줌
  - 주인공의 직업에 걸맞지 않은 숨겨진 취미(서브컬쳐)를 상대방에게 들키지만, 상대방은 비밀을 지키고 서브컬쳐로 이야기꽃을 나눈다.
  - 주인공이 남들에게 숨기고 싶었던 과거의 뼈아픈 트라우마(혹은 가장 약하고 비참한 모습)가 강제로 폭로될 위기에서 상대방이 스스로 악역을 자처해 시선을 돌려줌.
  - 주인공이 심각한 오해를 받아 모두가 손가락질하며 등을 돌렸을 때, 유일하게 상대방만이 아무런 조건 없이 주인공의 결백을 믿어줌.
  - 주인공의 부끄러운 비밀이 상대방에게 우연히 들통나지만, 상대방이 모른척해줌.
  - 주인공을 끈질기게 괴롭히며 가스라이팅하던 쓰레기 전남친(또는 스토커)이 회사/학교 앞까지 찾아왔을 때, 평소 데면데면했던 상대방이 기지(?)를 발휘해 '나 얘랑 동거 중인 약혼자인데?'라며 완벽한 연기로 구출해 줌. (이후 가짜 연기가 진짜 밀착으로 이어짐).
  - 사회적으로 유명한 잉꼬부부지만, 실제로는 서로 바람을 피우면서 싸우기만 하는 부모님에 질려서 집을 나와 캐리어를 끌고 비 오는 공원 벤치에 주저앉아 멍하니 있던 주인공. 그때 우산을 씌워주면서 몸을 녹이라고 말해주는 상대방
  - 상대방을 멸시하던 주인공이 실수로 크게 다칠뻔하지만 상대방이 도와주고 별 일 아니라는 듯이 넘어간다.
  second_event:
  - 주인공이 사랑을 느끼고 미소 짓는 모습을 몰래 찍은 협박범이 사회적 매장을 빌미로 협박할 때, 상대방이 협박범을 무자비하게 짓밟아 영상을 회수해 주고, 구원받은 주인공이 이성을 버린 척 스스로 목줄을 차며 애완동물이 되기를 자처함.
  - 흉악한 스토커나 괴한에게 납치되어 강간당할 절대절명의 위기에서 상대방이 주인공을 구해내고, 바깥세상의 끔찍한 공포에 질린 주인공이 '오직 당신의 방 안에서만, 당신의 사랑만 받으며 살겠다'며 영구적인 감금을 애원함.
  - 주인공의 탐욕스럽고 폭력적인 가족들이 강제 정략결혼(또는 감금)을 시키려 억지로 끌고 갈 때, 상대방이 권력과 재력으로 가족들과의 연을 완벽히 끊어내 주고, 갈 곳 없어진 주인공이 감격의 눈물을 흘리며 영원히 상대방의 연인이 되겠다고 맹세함.
  - 끔찍한 범죄나 스캔들에 억울하게 휘말려 모두가 주인공에게 돌을 던지고 감옥에 갈 위기에 처했을 때, 오직 상대방만이 모든 죄를 덮어주고(혹은 완벽히 해결해주고) 품어주자, 세상의 냉혹함에 환멸을 느낀 주인공이 이성적인 사고를 포기하는 척하고 오직 사랑만 쫓는 남주의 사랑 인형으로 행동한다.
  corruption_reasons:
  - 상대의 체취와 작은 스킨십이 주는 금단적인 사랑
  - 일상적인 애정이 점차 강렬한 감각적 갈구
  - 더 이상 똑똑하고 완벽하게 살지 않아도 된다는 안심.
  - 상대방에게 사랑스러운 짓을 하거나 부끄러운 모습을 보여줄 때마다 돌아오는 다정한 쓰다듬과 '착하다, 예쁘다'는 칭찬.
  - 내가 세상에서 제일 사랑스러운 연인이 되면, 저 사람은 평생 다른 여자는 쳐다보지도 않겠지?' 상대방을 절대 잃고 싶지 않다는 분리불안
  daily_corruption_changes:
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 서로의 칫솔, 수건, 심지어 속옷까지 구분 없이 공유하며 부끄러움을 상실함
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 사랑스러운 메세지와 사진을 1분 단위로 보냄.
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 일상적인 대화 중 자연스럽게 상대의 무릎에 앉거나 가랑이를 비빔
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 서로의 체취가 없으면 불면증에 시달려, 상대의 셔츠를 끌어안고 잠들음
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 출근/등교를 미루고 하루 종일 침대에서 뒹굴며 사랑스러운 생활함
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 밥을 먹을 때 수저 대신 서로의 입술로 음식을 넘겨주는 것이 루틴이 됨
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 다른 사람 앞에서는 멀쩡한 척하지만, 테이블 밑으로는 발가락으로 서로를 애무함
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 키스 없이는 살 수 없음.
  endings:
  - 몇 년 뒤, 평소에는 서로 티격태격하는 평범한 부부이지만, 집에서는 아이들 앞에서도 부끄러움 없이 서로 애정행각을 벌이는 부부가 됨.
  first_triggers:
  - 갑작스러운 소나기에 좁은 우산을 함께 쓰며 묘한 체취를 느낌
  - 야근 후 피곤해하는 상대방에게 진슈가이 산 피로회복제(은총)를 건네줌
  - 실수로 상대방의 음료를 마셔 간접키스를 한 후, 심장이 비정상적으로 뜀
  - 상대방이 다쳤을 때 상처를 치료해주다 숨결이 가까이 닿음
  - 상대의 자취방에서 영화를 보다가 우연히 손끝이 겹침
  - 밤늦은 통화 중 무의식적으로 튀어나온 사랑스러운 한숨
  - 상대방이 떨어뜨린 물건을 주워주다 머리카락이 얽힘
  - 붐비는 지하철에서 상대를 보호하려다 완전히 밀착됨
  - 길고양이/강아지를 같이 돌보다가 부부 같은 유대감이 생김
  - 상대방의 옷에 묻은 먼지를 털어주다 목덜미의 페로몬에 취함
  intermediate_phase:
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 평범한 메세지와 사진을 1분 단위로 보냄.
  - 서로의 체취가 있는 옷을 입으면 마음이 안정되어, 상대방의 셔츠를 빌려 입는 것이 일상이 됨
  - 상대방의 작은 습관(입맞춤, 손 잡기 등)에 대한 갈증이 점점 강해져, 하루에도 수십 번씩 연락을 남
  - 상대방의 취향과 성격을 모방하며, 서로가 점점 더 닮아가는 것을 의식적으로 즐김
  - 첫 키스 후부터 상대방의 입맛과 취향이 자신에게 전이되어, 같은 음식을 함께 먹어야 만족감을 느낌
  - 상대방의 몸에 닿았던 곳을 자신의 손으로 만지며, 그 감각을 기억하려는 집착이 생김
  name: 순애와 사랑 (일상)
  opponent_job_keywords:
  - 회사원
  - 선배
  - 단골손님
  - 사장
  - 학생
  protagonist_job_keywords:
  - 노숙자
  - 회사원
  - 대학생
  - 바리스타
  - 사서
  - 보육교사
  resistance_reasons:
  - 과거 가정 문제로 인해 형성된 사랑에 대한 보수적인 가치관
  - 첫 사랑을 순결하게 지키고 싶다는 소망
  - 평범하고 안정적인 일상이 주는 심리적 안전망
  second_triggers:
  - 우연한 신체 접촉에 얼굴을 붉히며 심장이 미친 듯이 뜀
  - 상대의 체취가 묻은 겉옷을 돌려주지 않고 밤마다 몰래 냄새를 맡음
  - 상대의 손길이 닿은 곳이 뜨겁게 달아오르는 감각에 중독됨
  - 일상적인 대화 도중 상대를 보면 하복부가 젖어오는 것을 느낌
  - 상대방의 다정한 말 한마디에 몸이 덜덜 떨릴 정도의 사랑을 느낌
  target_relationships:
  - 보통인 관계
  - 친밀한 관계
  - 소꿉친구
- concept: 평범하고 이성적이던 주인공이, 모두에게 다정한 하렘물 남주(상대방)를 사이에 두고 진슈가이식 천박한 애정공세를 펼치는 서브 주인공과 벌이는 삼각관계 러브코메디. 경쟁에서 지지 않으려고 시작한 과감한 시도가 자꾸만 성공하면서, 주인공은 상대방의 전용 연인이 되는 동시에 스스로 뇌를 버리고 천박하고 음탕한 빔보로 완성된다.
  import_point: 러브코메디이므로 상대방의 모든 행동과 생각은 주인공에 대한 애정에서 기반한다. 주인공의 모든 타락(빔보화)은 반드시 '서브 주인공과의 경쟁에서 지기 싫다'는 질투와 열폭에서 출발할 것. 서브 주인공은 진슈가이의 영향을 받아 천박하고 음탕하지만 악의는 없으며, 상대방은 모두에게 다정하고 연애담에 둔감해 두 여자의 경쟁을 눈치채지 못한다. 암운, 감금, 강제 성폭행 전개는 금지하고 망신·질투·경쟁·공개 고백으로 에로티시스를 구성할 것.
  id: 2
  first_event:
  - 치한에게 추행당하던 주인공이 상대방에게 구출되지만, 하필 진슈가이에서 굴러온 서브 주인공이 '여보~ 늦었죠♡'라며 팔짱을 끼고 그 자리에서 노골적으로 유혹해 구해준 사람의 옆자리를 선점해 간다.
  - 밤늦게 비를 맞으며 울던 주인공을 상대방이 우산을 들고 데리러 오는데, 이미 서브 주인공이 상대방의 셔츠를 빌려 입고 현관에서 배웅을 해버려서 주인공은 첫날부터 연인석을 잃는다.
  - 강간 위기에서 구출된 직후 서브 주인공이 '나도 그 자리에 있었으면 다 죽여버렸을 텐데♡'라며 상대방에게 애교를 부려, 주인공은 구원받은 자리조차 못 지킨다는 최초의 열폭을 느낀다.
  - 직업에 어울리지 않는 숨은 서브컬쳐 취미를 상대방에게 들키지만 비밀을 지켜주고 이야기꽃을 피우는데, 서브 주인공이 그 대화를 훔쳐 듣고 '그 취미 너무 순진해, 야한 쪽으로 바꿔줄게'라며 경쟁 구도로 몰고 간다.
  - 뼈아픈 과거가 폭로될 위기에서 상대방이 스스로 악역을 자처해 시선을 돌려주지만, 다음 날 서브 주인공이 '나는 그런 흑역사 없어. 대신 더 재밌는 데 갈 수 있지?'라며 상대방을 진슈가이 투어에 데려가 주인공이 처음으로 선공격을 결심한다.
  - 심각한 오해로 모두가 등을 돌렸을 때 유일하게 결백을 믿어준 사람이 상대방인데, 그 유언비어의 출처가 서브 주인공이었다는 의심이 남아 주인공은 자신이 사람과 경쟁 중임을 알게 된다.
  - 가스라이팅하던 전남친(스토커)이 회사(학교) 앞까지 찾아와 평소 데면데면하던 상대방이 '나 얘랑 동거 중인 약혼자인데?'라며 구출하는데, 때마침 서브 주인공이 '진짜 약혼자는 저요♡'라며 난입해 두 여자의 약혼자 선언이 겹치며 삼각관계가 공식화된다.
  - 바람을 피우면서 싸우기만 하는 잉꼬부부 부모에 질려 캐리어를 끌고 비 오는 공원 벤치에 주저앉은 주인공에게 상대방이 우산을 씌워주지만, 옆에서 서브 주인공이 '우리 집도 똑같아요'라며 상대방의 품에 파고들어 위로의 자리를 빼앗는다.
  - 상대방을 멸시하던 주인공이 크게 다칠 뻔하고 상대방이 별일 아니라는 듯 도와준 뒤, 주인공은 '이 사람을 이기려면 내가 먼저 바뀌어야 한다'고 판단해 진슈가이 예절 교양원 '퍼스트 레이디'에 등록서를 낸다.
  second_event:
  - 상대방을 좋아한다고 밝힌 THIRD(진슈가이 정예 멤버 또는 오래된 인연)가 등장해 하렘 후보가 한 명 더 늘고, 주인공은 '역시 평범한 나는 여기까지야'라며 도망치려 하지만 처음으로 서브 주인공이 눈물로 '너 없으면 나 혼자 못 해'라고 붙잡고, 두 사람 모두 상대방 앞에서 제 발로 목줄을 차는 것을 선택한다.
  - 진슈가이 축제(학교·회사 문화제) 무대에서 '누가 상대방의 전용인가' 공개 대결이 벌어지고, 수백 명의 관중 앞에서 주인공이 완전히 뇌를 버리고 천박한 고백을 외치자 상대방이 진심으로 두 팔을 뻗는다.
  - 상대방이 '둘 다 소중해'라는 망언을 남기고 도망치고, 두 여자는 처음으로 공동전선을 맺고 하렘물 남주를 역추적해 각자의 자리와 그 이상의 자리를 받아낸다.
  - 서브 주인공이 먼저 고백에 성공한 것처럼 보여 주인공이 완전 패배 직전까지 가지만, 매일 밤 통화한 상대가 주인공이었음을 뒤늦게 깨달은 상대방이 역전하고, 서브 주인공은 '나도 계속 경쟁할 거야!'라며 백기투항을 거부한다.
  - 상대방의 직장과 집안이 준비한 정략 약혼 소식이 보도되고, 두 여자는 처음으로 손에 손을 잡고 발표 현장에 함께 나타나 '약혼자는 우리 둘인데요?'라고 선언한다.
  first_triggers:
  - 서브 주인공의 천박한 농담에 상대방이 웃어주고, 주인공은 교양 있게 받아치려다 실패한 채 혼자 얼굴이 달아오름
  - 상대방이 무심코 '요즘 부쩍 귀엽네'라고 말하고, 주인공은 그 한 문장을 하루 종일 되뇌며 서브 주인공에게 온 메시지 개수를 세기 시작함
  - 야근한 상대방에게 진슈가이 산 피로회복제(은총)를 건넸는데 서브 주인공이 준 것과 같은 제품이라는 사실에 분개해 일부러 더 다정하게 건넴
  - 서브 주인공의 상처를 상대방이 치료해주는 장면을 목격하고, 다음 날 주인공이 스스로 손끝에 작은 상처를 만들어 상대방의 손길을 요구함
  - 서브 주인공이 입은 것과 같은 옷을 부티크 '비너스의 요람'에서 사 입었을 때 상대방의 반응이 좋아지자, 그 마음을 자기 취향이라 믿기로 결심함
  - 상대의 자취방에서 영화를 보다가 우연히 손끝이 겹쳤고, 그 일을 서브 주인공에게 먼저 말하지 못한 것을 하루 종일 후회함
  - 붐비는 지하철에서 상대방에게 보호되던 순간, 서브 주인공의 팔짱보다 강하게 상대의 팔을 감고 나서 자신에게만 있는 용감함에 놀람
  - 밤늦은 통화 중 무의식적으로 튀어나온 사랑스러운 한숨을 상대방이 칭찬해서, 그 말을 서브 주인공이 듣지 않았을까 노이로제에 걸림
  - 상대방이 떨어뜨린 손수건을 되돌려주지 않고 서브 주인공에게 들킬까 봐 숨긴 채 베개 삼고 잠듦
  second_triggers:
  - 서브 주인공의 노골적인 스킨십을 견제하다가 상대방의 손끝에 더 강하게 반응하고, 질투와 쾌락을 구분하지 못하게 됨
  - 상대방이 두 여자에게 똑같은 문장의 메시지를 보낸 사실을 10분간 분석해 '나한테 온 문장이 반 글자 길다'는 증거로 승리를 선언하고 포상을 요구함
  - 서브 주인공과 나란히 서서 상대방에게 팔짱을 꼈다가 어깨에 닿는 순서까지 매겨지며 흥분함
  - 공개 장소에서 '누가 더 다정한지' 승부를 제안받고, 예절 교양원에서 배운 천박한 애칭을 처음으로 소리 내어 부름
  - 상대방의 셔츠를 입고 서브 주인공에게 전화를 바꿔 '우리 오빠 지금 자고 있어요'라고 선언한 뒤, 스스로의 대담함에 다리가 풀림
  corruption_reasons:
  - 서브 주인공에게 노골적인 스킨십을 당할 때 지어지는 상대방의 다정한 표정, '저건 나를 볼 때와 같은 표정인데?'라는 공포와 흥분
  - 경쟁에서 지면 이 사람도 잃는다는 분리불안. 세상에서 제일 사랑스럽고 야한 여자가 되면 버려지지 않는다는 믿음
  - 더 이상 똑똑하고 품위 있게 살지 않아도 된다는 안심. 교양을 버리니 이렇게 편할 수가 없음
  - 천박한 말을 하거나 부끄러운 모습을 보여줄 때마다 돌아오는 다정한 쓰다듬과 '예쁘다', '그 말 좋아'라는 칭찬
  - 상대의 체취를 맡으면 잠시 연적 생각이 사라짐. 이 평온함을 놓치면 다시 질투로 죽을 것 같음
  daily_corruption_changes:
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 서로의 칫솔, 수건, 심지어 속옷까지 구분 없이 공유하며, 그 대열에 연적까지 합류시키는 것을 자연스럽게 여김
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 상대방의 셔츠를 입은 채 연적에게 전화를 바꿔 '우리 오빠 지금 자고 있어요'라고 선언함
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 사랑스러운 메시지와 사진을 1분 단위로 보내고, 연적에게 온 답장 시간을 재며 우열을 가림
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 테이블 밑으로 발가락으로 서로를 애무하며, 연적과 나란히 앉은 자리에서도 태연함을 유지함
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 밥을 수저 대신 서로의 입술로 넘겨주는 것이 루틴이 되고, '연적이 못 한 걸 내가 했다'며 실적처럼 자랑함
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 예절 교양원에서 배운 천박한 애칭을 부르지 못하면 잠자리에 들지 못함
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 출근과 등교를 미루고 하루 종일 침대에서 뒹굴며 사랑스러운 생활하고, 연적과의 애정 순번표를 협상함
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 서로의 체취가 없으면 불면증에 시달려 상대의 셔츠를 끌어안고 잠들고, 연적과 하룻밤씩 교대한다는 규칙까지 받아들임
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 '오늘 내가 더 귀여웠다'는 확답을 받을 때까지 잠들지 않으며, 근거로 연적과의 비교 사진을 제시함
  intermediate_phase:
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 연적이 보낸 사진과 자기 사진을 나란히 두고 어느 쪽이 더 사랑스러운지 판정을 요구함
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 연적보다 두 배 많은 메시지를 보내지 않으면 불안해서 잠들지 못함
  - 연적이 쓰던 것과 같은 향수를 사서 뿌렸을 때 상대방의 반응이 좋아지자, 그것을 자기 취향으로 확정해버림
  - 남들 앞에서는 정상적으로 행동하지만 둘만 있을 때는 예절 교양원에서 배운 '남자를 홀리는 화술'을 시연하고, '좋아한다'는 칭찬 한 마디에 뇌가 하얗게 변하는 것을 즐김
  - 연적의 천박한 말투를 무의식적으로 흉내 내기 시작했고, 상대방이 '요즘 말투 좋다'고 말해버려서 되돌릴 수 없게 됨
  - 상대방의 몸에 닿았던 곳을 자신의 손으로 만지며 감각을 기억하려 하고, 연적이 만졌을 것 같은 자리에서는 힘이 들어감
  - 질투로 시작한 스킨십이 어느새 순수한 갈구로 전환되어, 연적이 있는 자리에서도 상대방의 손끝을 찾게 됨
  - 서로의 체취가 있는 옷을 입으면 마음이 안정되어 상대방의 셔츠를 빌려 입는 것이 일상이 되고, 연적에게 빼앗길까 봐 세탁을 미룸
  resistance_reasons:
  - "어머니에게 배운 품위 있는 사랑이라는 강박, 사랑에서 지면 인생에서도 지는 것#품위를 버린 사람이 먼저 사랑에서 이기고 있다는 현실을 인정하게 됨"
  - "첫사랑은 깨끗해야 한다는 소신#연적의 천박함이 계속 성공하는 것에 대한 굴욕"
  - 나는 저 소란스러운 진슈가이의 세계와 거리가 먼 인간이라는 자기상
  endings:
  - 몇 년 뒤, 상대방의 양쪽에 두 여자가 하나씩 팔짱을 끼고 다니는 상대방 입장에서는 정석 하렘물 해피엔딩. 주인공은 사회인으로서의 언행은 완전히 정상적으로 유지하지만, 집에서는 아이들 앞에서도 부끄러움 없이 서로 애정행각을 벌이고 연적과는 애정 순번을 사이좋게 나눈다.
  - 몇 년 뒤, 서브 주인공이 '내가 졌다'고 백기투항한 뒤 주인공의 편에서 가장 열렬한 응원을 자처하는 주인공의 완승 단애 엔딩. 주인공은 상대방의 전용 사랑스러운 연인이 되었지만 부끄러움은 완전히 버려서, 남들 앞에서는 멀쩡한 척하면서 집에서는 상대방에게 천박하게 매달리는 빔보 연인이 된다.
